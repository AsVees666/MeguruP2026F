<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #f4eee5;
  font-family: 'Zen Maru Gothic', sans-serif;
}

/* アプリ全体のフレックスレイアウト */
#app {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  max-width: 600px;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
  background: #f4eee5;
}

/* ヘッダー領域 */
header {
  height: 70px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 10;
}

/* メイン領域：画面サイズに合わせて伸縮 */
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 16px;
  overflow: hidden;
  position: relative;
}

/* ヘッダーSVG */
.header-menu-svg {
  height: 36px;
  width: auto;
}

.header-btn-svg {
  height: 32px;
  width: auto;
  cursor: pointer;
}

/* メインSVG */
.main-card-svg {
  width: 100%;
  max-width: 480px;
  height: auto;
  max-height: 95%;
  touch-action: none;
}

#_キラキラバー, #_ワクワクバー, #_ほっこりバー, #_イライラバー, #_しょんぼりバー,
#_キラキラつまみ, #_ほっこりつまみ, #_イライラつまみ, #_しょんぼりつまみ {
  cursor: ns-resize;
  touch-action: none;
}

#_完了ボタン, #_日記記録ボタン, #_記録を終えるボタン, #_メニュー, #dialog-ok-btn {
  cursor: pointer;
  touch-action: manipulation;
}

svg [role="button"], .interactive-btn {
  cursor: pointer;
}

/* SVG共通ダイアログオーバーレイ */
.dialog-overlay {
  position: absolute;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(80, 60, 40, 0.35);
  backdrop-filter: blur(2px);
}

.dialog-overlay.show {

}

.dialog-svg {
  width: 100%;
  max-width: 360px;
  height: auto;
  filter: drop-shadow(0 8px 24px rgba(80, 60, 40, 0.16));
}

<script>
(() => {
  "use strict";

  const SUPABASE_URL =
    "https://vhzxwnyxgmtgteatgwcj.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_zFptSnTXIBaVQFCeYairJQ_WAx6ZL1L";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  async function getCurrentUser() {
    const { data, error } = await supabaseClient.auth.getUser();

    if (error) throw error;

    if (!data.user) {
      throw new Error("ログインしていません。ログインし直してください。");
    }

    return data.user;
  }

  function showDialog(message, title = "お知らせ") {
    return new Promise(resolve => {
      const dialog = document.getElementById("common-dialog");
      const titleElement = document.getElementById("dialog-title");
      const messageElement = document.getElementById("dialog-message");
      const okButton = document.getElementById("dialog-ok-btn");

      titleElement.textContent = title;

      while (messageElement.firstChild) {
        messageElement.removeChild(messageElement.firstChild);
      }

      const rawLines = String(message || "").split("\n");
      const lines = [];
      rawLines.forEach(line => {
        if (line.length <= 18) {
          lines.push(line);
        } else {
          for (let i = 0; i < line.length; i += 18) {
            lines.push(line.slice(i, i + 18));
          }
        }
      });

      const lineHeight = 25;
      const startY = lines.length === 1 ? 134 : 118;

      lines.forEach((text, index) => {
        const tspan = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
        tspan.setAttribute("x", "190");
        tspan.setAttribute("y", String(startY + index * lineHeight));
        tspan.textContent = text;
        messageElement.appendChild(tspan);
      });

      dialog.classList.add("show");

      const close = () => {
        dialog.classList.remove("show");
        okButton.removeEventListener("click", close);
        okButton.removeEventListener("keydown", onKeyDown);
        resolve();
      };

      const onKeyDown = event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          close();
        }
      };

      okButton.addEventListener("click", close);
      okButton.addEventListener("keydown", onKeyDown);
      okButton.focus();
    });
  }

  const svg = document.getElementById("art");
  const markImage = document.getElementById("emotion-mark-image");
  const MARK_NAMES = {
    hokkori: "ほっこり",
    massara: "まっさら",
    ukiuki: "うきうき",
    meramera: "めらめら",
    sowasowa: "そわそわ",
    punpun: "ぷんぷん",
    moyamoya: "もやもや",
    shinmiri: "しんみり",
    gakkuri: "がっくり",
    hetahhe: "へとへと"
  };

  const values = { kirakira: 0, hokkori: 0, iraira: 0, shonbori: 0 };

  let confirmedEmotion = null;
  let hasConfirmedEmotion = false;

  // 感情マークの判定には、従来どおり0〜4の整数値を使用する
  function getLevels() {
    const toLevel = value => Math.max(0, Math.min(4, Math.floor(value)));
    return {
      kirakira: toLevel(values.kirakira),
      hokkori: toLevel(values.hokkori),
      iraira: toLevel(values.iraira),
      shonbori: toLevel(values.shonbori)
    };
  }

  // 保存・再表示用には、バーの位置を小数第2位までに整えて使用する
  function getContinuousValues() {
    const roundToTwoDecimals = value => Number(Number(value).toFixed(2));
    return {
      kirakira: roundToTwoDecimals(values.kirakira),
      hokkori: roundToTwoDecimals(values.hokkori),
      iraira: roundToTwoDecimals(values.iraira),
      shonbori: roundToTwoDecimals(values.shonbori)
    };
  }

  const sliders = [
    { key: "kirakira", trackId: "_キラキラバー", thumbId: "_キラキラつまみ" },
    { key: "hokkori", trackId: "_ワクワクバー", thumbId: "_ほっこりつまみ" },
    { key: "iraira", trackId: "_イライラバー", thumbId: "_イライラつまみ" },
    { key: "shonbori", trackId: "_しょんぼりバー", thumbId: "_しょんぼりつまみ" }
  ];

  const geometry = sliders.map(slider => {
    const track = document.querySelector(`#${CSS.escape(slider.trackId)} rect:not([fill="transparent"])`);
    const thumb = document.querySelector(`#${CSS.escape(slider.thumbId)} circle:not([fill="transparent"])`);
    const thumbHit = document.querySelector(`#${CSS.escape(slider.thumbId)} circle[fill="transparent"]`);
    return {
      ...slider,
      trackX: Number(track.getAttribute("x")),
      trackY: Number(track.getAttribute("y")),
      trackWidth: Number(track.getAttribute("width")),
      trackHeight: Number(track.getAttribute("height")),
      thumbCircle: thumb,
      thumbHitCircle: thumbHit,
      thumbRadius: Number(thumb.getAttribute("r")),
      centerX: Number(thumb.getAttribute("cx")),
      bottom: Number(track.getAttribute("y")) + Number(track.getAttribute("height"))
    };
  });

  /*
   * 美紀さんの感覚・直感に合わせた新しい感情分類ロジック
   */
  function classifyEmotion() {
    const { kirakira: k, hokkori: h, iraira: i, shonbori: s } = getLevels();

    // 1. まっさら：すべてのバーが 0 または 1 の低い状態
    if (k <= 1 && h <= 1 && i <= 1 && s <= 1) {
      return "massara";
    }

    // 2. そわそわ：すべてのバーが高い（すべて 3 以上など）、または色んな感情がバラバラに高く入り混じっているとき
    if ((k >= 3 && h >= 3 && i >= 3 && s >= 3) || (k >= 2 && h >= 2 && i >= 2 && s >= 2 && Math.max(k,h,i,s) - Math.min(k,h,i,s) <= 1)) {
      return "sowasowa";
    }

    const positiveTotal = k + h;
    const negativeTotal = i + s;

    // 3. もやもや：ネガティブ（イライラ・しょんぼり）が高め（2以上）で、ポジティブがあまり高くない、あるいは両方が拮抗してすっきりしないとき
    if ((i >= 2 || s >= 2) && (positiveTotal <= negativeTotal || (Math.abs(positiveTotal - negativeTotal) <= 1 && i >= 2 && h >= 2))) {
      return "moyamoya";
    }

    // 4. めらめら：キラキラとイライラが両方高いとき（熱いエネルギーと焦り・闘争心）
    if (k >= 2 && i >= 2 && k + i >= h + s) {
      return "meramera";
    }

    // 5. うきうき：キラキラが一番高い、またはキラキラ＋ほっこりが元気いっぱいに高いとき
    if (k >= h && k >= i && k >= s && (k >= 2 || (k >= 1 && h >= 1))) {
      return "ukiuki";
    }

    // 6. ほっこり：ほっこりが一番高く、穏やかな温かさがあるとき
    if (h >= k && h >= i && h >= s && h >= 2) {
      return "hokkori";
    }

    // 7. ぷんぷん：イライラが単独で突出して高いとき
    if (i > k && i >= h && i > s && i >= 2) {
      return "punpun";
    }

    // 8. がっくり：しょんぼりが一番高くて深く落ち込んでいるとき
    if (s > k && s >= h && s >= i && s >= 3) {
      return "gakkuri";
    }

    // 9. しんみり：しょんぼりが中くらい（2前後）で、切なさや静けさがあるとき
    if (s >= 2 && s >= k && s >= h) {
      return "shinmiri";
    }

    // 10. へとへと：全体的にエネルギーが低め〜中くらいで、ネガティブ寄り（疲労感・燃え尽き）
    if (i >= 2 || s >= 2 || (k + h + i + s <= 4)) {
      return "hetahhe";
    }

    return "moyamoya";
  }

  function updateThumb(item) {
    const value = values[item.key];
    const circle = item.thumbCircle;
    const hitCircle = item.thumbHitCircle;
    const minCenter = item.trackY + item.thumbRadius;
    const maxCenter = item.bottom - item.thumbRadius;
    const progress = value / 4;
    const cy = maxCenter - progress * (maxCenter - minCenter);

    circle.setAttribute("cx", item.centerX.toFixed(2));
    circle.setAttribute("cy", cy.toFixed(2));
    if (hitCircle) {
      hitCircle.setAttribute("cx", item.centerX.toFixed(2));
      hitCircle.setAttribute("cy", cy.toFixed(2));
    }
  }

  function updateAllThumbs() {
    geometry.forEach(updateThumb);
  }

  function clearMark() {
    hasConfirmedEmotion = false;
    confirmedEmotion = null;
    markImage.setAttribute("visibility", "hidden");
    markImage.removeAttribute("href");
    markImage.removeAttributeNS("http://www.w3.org/1999/xlink", "href");
  }

  function showEmotionMark() {
    const id = classifyEmotion();
    hasConfirmedEmotion = true;

    if (!id) {
      confirmedEmotion = null;
      markImage.setAttribute("visibility", "hidden");
      markImage.removeAttribute("href");
      markImage.removeAttributeNS("http://www.w3.org/1999/xlink", "href");
      return null;
    }

    const filename = MARK_NAMES[id] + ".png";
    confirmedEmotion = { id, name: MARK_NAMES[id], filename };
    markImage.setAttribute("href", filename);
    markImage.setAttribute("visibility", "visible");
    return confirmedEmotion;
  }

  function toSvgPoint(clientX, clientY) {
    const point = svg.createSVGPoint();
    point.x = clientX;
    point.y = clientY;
    return point.matrixTransform(svg.getScreenCTM().inverse());
  }

  function setSliderValue(item, clientY) {
    const pointer = toSvgPoint(0, clientY);
    const minCenter = item.trackY + item.thumbRadius;
    const maxCenter = item.bottom - item.thumbRadius;
    const clampedY = Math.max(minCenter, Math.min(maxCenter, pointer.y));
    const ratio = (maxCenter - clampedY) / (maxCenter - minCenter);
    values[item.key] = Math.max(0, Math.min(4, ratio * 4));
    updateThumb(item);
    clearMark();
  }

  let active = null;
  let activePointerId = null;

  geometry.forEach(item => {
    const trackGroup = document.getElementById(item.trackId);
    const thumbGroup = document.getElementById(item.thumbId);

    const begin = event => {
      active = item;
      activePointerId = event.pointerId;
      if (event.currentTarget.setPointerCapture) {
        try { event.currentTarget.setPointerCapture(event.pointerId); } catch (_) {}
      }
      setSliderValue(item, event.clientY);
      event.preventDefault();
    };

    trackGroup.addEventListener("pointerdown", begin);
    thumbGroup.addEventListener("pointerdown", begin);
  });

  document.addEventListener("pointermove", event => {
    if (!active || event.pointerId !== activePointerId) return;
    setSliderValue(active, event.clientY);
    event.preventDefault();
  }, { passive: false });

  function endDrag(event) {
    if (active && (activePointerId === null || event.pointerId === activePointerId)) {
      active = null;
      activePointerId = null;
    }
  }
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", endDrag);

  function makeButton(id, callback) {
    const element = document.getElementById(id);
    if (!element) return;
    element.setAttribute("role", "button");
    element.setAttribute("tabindex", "0");
    element.addEventListener("click", callback);
    element.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        callback();
      }
    });
  }

  makeButton("_完了ボタン", () => {
    const result = showEmotionMark();
    window.dispatchEvent(new CustomEvent("emotion:classified", {
      detail: {
        values: getLevels(),
        emotion: result
      }
    }));
  });

  function localDateString() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  async function saveRecord() {
    if (!hasConfirmedEmotion || !confirmedEmotion) {
      throw new Error("先に「完了」ボタンを押してください。");
    }

    const user = await getCurrentUser();

    const record = {
      date: localDateString(),
      values: getContinuousValues(),
      emotionId: confirmedEmotion.id,
      emotionName: MARK_NAMES[confirmedEmotion.id],
      markFile: MARK_NAMES[confirmedEmotion.id] + ".png",
      savedAt: new Date().toISOString()
    };

    const { data: existingRecord, error: selectError } =
      await supabaseClient
        .from("diaries")
        .select("content")
        .eq("user_id", user.id)
        .eq("entry_date", record.date)
        .maybeSingle();

    if (selectError) throw selectError;

    const { error: saveError } = await supabaseClient
      .from("diaries")
      .upsert({
        user_id: user.id,
        entry_date: record.date,
        kirakira: record.values.kirakira,
        hokkori: record.values.hokkori,
        iraira: record.values.iraira,
        shonbori: record.values.shonbori,
        emotion_id: record.emotionId,
        content: existingRecord ? existingRecord.content : null
      }, {
        onConflict: "user_id,entry_date"
      });

    if (saveError) throw saveError;

    localStorage.setItem(
      "emotion-record-" + record.date,
      JSON.stringify(record)
    );

    window.dispatchEvent(
      new CustomEvent("emotion:save-request", { detail: record })
    );

    return record;
  }

  makeButton("_メニュー", () => {
    if (typeof window.openMenu === "function") {
      window.openMenu();
    }
  });

  makeButton("_日記記録ボタン", async () => {
    try {
      await saveRecord();
      window.location.href = "kiroku.html";
    } catch (error) {
      console.error(error);
      await showDialog(
        error.message || "保存できませんでした。\nもう一度お試しください。",
        "保存できませんでした"
      );
    }
  });

  makeButton("_記録を終えるボタン", async () => {
    try {
      await saveRecord();
      await showDialog(
        "今日の気持ちを残しました。",
        "記録が完了しました"
      );
      window.location.href = "index.html";
    } catch (error) {
      console.error(error);
      await showDialog(
        error.message || "保存できませんでした。\nもう一度お試しください。",
        "保存できませんでした"
      );
    }
  });

  window.emotionInput = {
    getValues: () => getLevels(),
    getContinuousValues: () => getContinuousValues(),
    classify: classifyEmotion,
    getConfirmedEmotion: () => hasConfirmedEmotion ? confirmedEmotion : null,
    isConfirmed: () => hasConfirmedEmotion,
    setValues: next => {
      const keys = ["kirakira", "hokkori", "iraira", "shonbori"];
      if (!next || keys.some(key =>
        typeof next[key] !== "number" ||
        !Number.isFinite(next[key]) ||
        next[key] < 0 ||
        next[key] > 4
      )) {
        throw new Error("4つのバーに0〜4の数値を指定してください。");
      }
      keys.forEach(key => values[key] = next[key]);
      updateAllThumbs();
      clearMark();
      return classifyEmotion();
    }
  };

  updateAllThumbs();
})();
</script>
