<style>
* {
  box-sizing: border-box;
}

:root {
  --paper: #f4eee5;
  --brown: #8b6f55;
  --blue: #88a3ba;
  --white: #fff;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--paper);
  font-family: 'Zen Maru Gothic', sans-serif;
  color: var(--brown);
}

#app {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  max-width: 600px;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
  background: var(--paper);
}

header {
  height: 70px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 10;
  background: var(--paper);
}

.header-svg {
  height: 36px;
  width: auto;
  display: block;
}

main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px 24px;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
}

main::-webkit-scrollbar {
  display: none;
}

#loading,
#recordContent {
  width: 100%;
  max-width: 480px;
}

.record-svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}

.record-svg text {
  font-family: 'Zen Maru Gothic', sans-serif;
}

#emotionMark {
  pointer-events: none;
}

#diaryText {
  padding: 0 14px 24px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 15px;
  line-height: 1.9;
  min-height: 0;
}

#diaryText:empty {
  display: none;
}

.section-title {
  font-size: 18px;
  font-weight: 700;
  margin: 12px 14px 14px;
}

.reflection-list {
  padding: 0 0 16px;
}

.reflection-card {
  position: relative;
  background: var(--white);
  border-radius: 16px;
  margin: 0 0 14px;
  padding: 18px 42px 22px 22px;
  min-height: 110px;
  box-shadow: 0 1px 2px rgba(139, 111, 85, .04);
}

.reflection-date {
  font-size: 16px;
  margin: 0 0 12px;
  color: var(--brown);
}

.reflection-content {
  font-size: 15px;
  line-height: 1.85;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: var(--brown);
}

.edit-reflection {
  position: absolute;
  right: 16px;
  top: 14px;
  border: 0;
  background: transparent;
  color: var(--brown);
  font-size: 20px;
  padding: 2px 5px;
  cursor: pointer;
}

.edit-reflection:disabled {
  display: none;
}

#emptyReflection {
  margin: 0 14px 22px;
  font-size: 13px;
  opacity: .8;
}

.add-wrap {
  display: flex;
  justify-content: flex-end;
  padding: 0 4px 14px;
  position: sticky;
  bottom: 0;
  pointer-events: none;
}

#addReflection {
  pointer-events: auto;
  border: 0;
  border-radius: 22px;
  background: #8b6f55;
  color: var(--white);
  font-family: inherit;
  font-size: 15px;
  padding: 11px 24px;
  min-width: 186px;
  cursor: pointer;
  box-shadow: 0 2px 7px rgba(80, 90, 100, .12);
}

footer {
  height: 80px;
  padding: 0 32px calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 10;
  background: var(--paper);
}

.footer-svg {
  width: 100%;
  height: 50px;
  display: block;
}

svg [role="button"],
.interactive-btn {
  cursor: pointer;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(65, 48, 35, .28);
  z-index: 50;
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding: 16px;
}

.modal-backdrop.open {
  display: flex;
}

.editor {
  width: 100%;
  max-width: 560px;
  background: var(--paper);
  border-radius: 20px;
  padding: 22px 18px max(20px, env(safe-area-inset-bottom));
  box-shadow: 0 8px 30px rgba(0, 0, 0, .15);
}

.editor h2 {
  font-size: 18px;
  margin: 0 0 14px;
}

#reflectionInput {
  width: 100%;
  min-height: 180px;
  resize: vertical;
  border: 1px solid #d8c8b8;
  border-radius: 12px;
  background: var(--white);
  padding: 14px;
  color: var(--brown);
  font: 15px/1.8 'Zen Maru Gothic', sans-serif;
  outline-color: var(--blue);
}

.editor-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 14px;
}

.editor-actions button {
  border: 0;
  border-radius: 18px;
  padding: 10px 20px;
  font: 14px 'Zen Maru Gothic', sans-serif;
  cursor: pointer;
}

#cancelEdit {
  background: #e6ddd2;
  color: var(--brown);
}

#saveEdit {
  background: #8b6f55;
  color: var(--white);
}

.status {
  padding: 30px;
  text-align: center;
  font-size: 14px;
}

@media (max-width: 480px) {
  #diaryText {
    padding: 0 8px 20px;
  }

  .section-title,
  #emptyReflection {
    margin-left: 8px;
    margin-right: 8px;
  }
}
</style>

<script>
const SUPABASE_URL = "https://vhzxwnyxgmtgteatgwcj.supabase.co";
const SUPABASE_KEY = "sb_publishable_zFptSnTXIBaVQFCeYairJQ_WAx6ZL1L";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

(async function(){
  "use strict";
  const NS = "http://www.w3.org/2000/svg";
  const params = new URLSearchParams(location.search);
  const entryDate = params.get("date");
  const loading = document.getElementById("loading");
  const recordContent = document.getElementById("recordContent");
  const reflectionList = document.getElementById("reflectionList");
  const emptyReflection = document.getElementById("emptyReflection");
  const modal = document.getElementById("editorModal");
  const input = document.getElementById("reflectionInput");
  const saveButton = document.getElementById("saveEdit");
  let currentUser = null;
  let editingReflectionId = null;
  let reflections = [];

  const PAGES = {
    home: "index.html",
    calendar: "calendar.html",
    search: "kensaku.html",
    mypage: "mypage.html"
  };

  const imageNames = {
    ukiuki:"うきうき.png",hokkori:"ほっこり.png",massara:"まっさら.png",
    meramera:"めらめら.png",sowasowa:"そわそわ.png",punpun:"ぷんぷん.png",
    moyamoya:"もやもや.png",shinmiri:"しんみり.png",gakkuri:"がっくり.png",
    hetahhe:"へとへと.png"
  };

  function showError(message){
    loading.hidden = false;
    loading.textContent = message;
    recordContent.hidden = true;
  }
  function formatDate(dateString){
    const parts = dateString.split("-");
    return `${parts[0]}.${Number(parts[1])}.${Number(parts[2])}`;
  }
  function localDateString(date){
    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
  }
  function navigate(page){
    location.href = PAGES[page];
  }
  function addHitArea(groupId, label, action){
    const group = document.getElementById(groupId);
    if(!group || group.querySelector(".hit-area")) return;

    let bounds;
    try{
      bounds = group.getBBox();
    }catch(e){
      return;
    }
    if(!bounds.width || !bounds.height) return;

    const hit = document.createElementNS(NS, "rect");
    hit.classList.add("hit-area");
    hit.setAttribute("x", bounds.x - 8);
    hit.setAttribute("y", bounds.y - 8);
    hit.setAttribute("width", bounds.width + 16);
    hit.setAttribute("height", bounds.height + 16);
    hit.setAttribute("fill", "transparent");
    hit.setAttribute("pointer-events", "all");
    hit.setAttribute("role", "button");
    hit.setAttribute("tabindex", "0");
    hit.setAttribute("aria-label", label);
    hit.style.cursor = "pointer";

    hit.addEventListener("click", action);
    hit.addEventListener("keydown", e => {
      if(e.key === "Enter" || e.key === " "){
        e.preventDefault();
        action();
      }
    });

    group.appendChild(hit);
  }
  function setEmotionMark(emotionId){
    const svg=document.querySelector("#recordArtwork svg");
    const group=svg.querySelector("#_マーク位置");
    if(!group) return;
    group.replaceChildren();
    const filename=imageNames[emotionId];
    if(filename){
      const image=document.createElementNS(NS,"image");
      image.setAttribute("x","205.33");image.setAttribute("y","102.91");
      image.setAttribute("width","174.89");image.setAttribute("height","174.89");
      image.setAttribute("href",filename);image.setAttribute("preserveAspectRatio","xMidYMid meet");
      group.appendChild(image);
    }
  }
  function setSliderThumb(id, value){
    const circle=document.querySelector(`#recordArtwork svg #${CSS.escape(id)} circle`);
    if(!circle) return;
    const n=Math.max(0,Math.min(4,Number(value)||0));
    const top=388.14, bottom=578.85;
    circle.setAttribute("cy",String(bottom-(n/4)*(bottom-top)));
  }
  function openEditor(reflection=null){
    editingReflectionId = reflection ? reflection.id : null;
    input.value = reflection ? (reflection.content || "") : "";
    document.getElementById("editorTitle").textContent = reflection ? "追記を編集" : "追記を書く";
    modal.classList.add("open");
    setTimeout(()=>input.focus(),50);
  }
  function closeEditor(){modal.classList.remove("open");editingReflectionId=null;}
  function canEdit(reflection){
    return localDateString(new Date(reflection.created_at)) === localDateString(new Date());
  }
  function renderReflections(){
    reflectionList.replaceChildren();
    emptyReflection.hidden = reflections.length > 0;
    reflections.forEach(reflection=>{
      const card=document.createElement("article");
      card.className="reflection-card";
      const date=document.createElement("div");
      date.className="reflection-date";
      const saved=new Date(reflection.created_at);
      date.textContent=`${saved.getFullYear()}.${saved.getMonth()+1}.${saved.getDate()}`;
      const content=document.createElement("div");
      content.className="reflection-content";
      content.textContent=reflection.content || "";
      card.append(date,content);
      if(canEdit(reflection)){
        const edit=document.createElement("button");
        edit.className="edit-reflection";edit.type="button";edit.textContent="✎";
        edit.setAttribute("aria-label","追記を編集");
        edit.addEventListener("click",()=>openEditor(reflection));
        card.appendChild(edit);
      }
      reflectionList.appendChild(card);
    });
  }
  async function loadPage(){
    if(!entryDate || !/^\d{4}-\d{2}-\d{2}$/.test(entryDate)){
      showError("日付が指定されていません。カレンダーから記録を選んでください。");return;
    }
    const {data:{user},error:userError}=await supabaseClient.auth.getUser();
    if(userError || !user){location.href="login.html";return;}
    currentUser=user;

    const {data:diary,error:diaryError}=await supabaseClient
      .from("diaries")
      .select("entry_date,emotion_id,kirakira,hokkori,iraira,shonbori,content")
      .eq("user_id",user.id).eq("entry_date",entryDate).maybeSingle();
    if(diaryError){console.error(diaryError);showError("日記の読み込みに失敗しました。");return;}
    if(!diary){showError("この日の記録は見つかりませんでした。");return;}

    const svg=document.querySelector("#recordArtwork svg");
    const dateText=svg.querySelector("#_今日の日付");
    if(dateText){
      const t=dateText.querySelector("text");
      if(t){t.replaceChildren();t.textContent=formatDate(entryDate);}
    }
    setEmotionMark(diary.emotion_id);
    setSliderThumb("_キラキラつまみ",diary.kirakira);
    setSliderThumb("_ほっこりつまみ",diary.hokkori);
    setSliderThumb("_イライラつまみ",diary.iraira);
    setSliderThumb("_しょんぼりつまみ",diary.shonbori);

    const diaryText=document.getElementById("diaryText");
    diaryText.textContent=diary.content || "";
    if(!diary.content || !diary.content.trim()) diaryText.hidden=true;

    const {data:reflectionData,error:reflectionError}=await supabaseClient
      .from("diary_reflections")
      .select("id,content,created_at,updated_at")
      .eq("user_id",user.id).eq("entry_date",entryDate)
      .order("created_at",{ascending:true});
    if(reflectionError){console.error(reflectionError);showError("追記の読み込みに失敗しました。");return;}
    reflections=reflectionData || [];
    renderReflections();
    loading.hidden=true;
    recordContent.hidden=false;
  }

  addHitArea("_メニュー", "メニュー", () => {
    if(typeof window.openMenu === "function") window.openMenu();
  });
  addHitArea("_ホーム", "ホーム", () => navigate("home"));
  addHitArea("_カレンダー", "カレンダー", () => navigate("calendar"));
  addHitArea("_検索", "検索", () => navigate("search"));
  addHitArea("_マイページ", "マイページ", () => navigate("mypage"));

  document.getElementById("addReflection").addEventListener("click",()=>openEditor());
  document.getElementById("cancelEdit").addEventListener("click",closeEditor);
  modal.addEventListener("click",event=>{if(event.target===modal)closeEditor();});
  saveButton.addEventListener("click",async()=>{
    const content=input.value.trim();
    if(!content){alert("追記する内容を入力してください。");return;}
    saveButton.disabled=true;
    try{
      if(editingReflectionId){
        const {data,error}=await supabaseClient.from("diary_reflections")
          .update({content,updated_at:new Date().toISOString()})
          .eq("id",editingReflectionId).eq("user_id",currentUser.id)
          .select("id,content,created_at,updated_at").single();
        if(error) throw error;
        reflections=reflections.map(item=>item.id===editingReflectionId?data:item);
      }else{
        const {data,error}=await supabaseClient.from("diary_reflections")
          .insert({user_id:currentUser.id,entry_date:entryDate,content})
          .select("id,content,created_at,updated_at").single();
        if(error) throw error;
        reflections.push(data);
      }
      renderReflections();closeEditor();
    }catch(error){
      console.error(error);alert("追記を保存できませんでした。時間をおいてもう一度お試しください。");
    }finally{saveButton.disabled=false;}
  });

  await loadPage();
})();
</script>
</body>
