
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ログイン | meguru</title>

  <!-- 全丸ゴシック（Zen Maru Gothic） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Zen Maru Gothic", sans-serif !important;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4eee5;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100svh;
      min-height: 100dvh;
    }

    /* SVG全体を画面内に収める */
    .login-stage {
      position: relative;
      width: min(100vw, calc(100dvh * 750 / 1624));
      height: auto;
      aspect-ratio: 750 / 1624;
      flex: 0 0 auto;
    }

    .artwork {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 入力欄 */
    .field {
      position: absolute;
      left: 12.2853%;
      width: 75.4307%;
      height: 4.8904%;
      border: none;
      outline: none;
      background: transparent;
      color: #594735;
      font-size: clamp(12px, 2.7vw, 20px);
      font-weight: 400;
      line-height: 1.4;
      padding: 0 3.2%;
      text-align: left;
      border-radius: 12px;
    }

    .field::placeholder {
      color: transparent;
    }

    .field:focus {
      outline: none;
    }

    #email {
      top: 34.0099%;
    }

    #password {
      top: 42.7876%;
      padding-right: 14%;
    }

    /* パスワードの表示・非表示 */
    .password-toggle {
      position: absolute;
      top: 42.7876%;
      right: 12.2853%;
      width: 12%;
      height: 4.8904%;
      border: 0;
      padding: 0;
      background: transparent;
      color: #8b6f55;
      font: inherit;
      font-size: clamp(11px, 2.2vw, 16px);
      cursor: pointer;
      border-radius: 10px;
      -webkit-tap-highlight-color: transparent;
    }

    .password-toggle:focus-visible {
      outline: 2px solid #8b6f55;
      outline-offset: -3px;
    }

    /* ボタン */
    .action {
      position: absolute;
      top: 51.4187%;
      height: 4.8498%;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      border-radius: 12px;
      -webkit-tap-highlight-color: transparent;
    }

    #loginButton {
      left: 13.536%;
      width: 32.6693%;
    }

    #signupButton {
      left: 53.7947%;
      width: 32.6693%;
    }

    .action:focus-visible {
      outline: 2px solid #8b6f55;
      outline-offset: 3px;
    }

    .action:disabled {
      cursor: wait;
    }

    .status {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    /* ダイアログ */
    dialog {
      width: min(86vw, 420px);
      border: 1px solid #cbb8a5;
      border-radius: 14px;
      padding: 24px 22px 18px;
      color: #594735;
      background: #fffdf9;
      font-size: 15px;
      text-align: center;
    }

    dialog::backdrop {
      background: rgba(50, 39, 29, .32);
    }

    #dialogMessage {
      margin: 0 0 20px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    #dialogClose {
      min-width: 112px;
      border: 0;
      border-radius: 9px;
      padding: 10px 22px;
      color: white;
      background: #8b6f55;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <main class="login-stage" aria-label="meguru ログイン">

    <!-- SVGデザイン：元のデータをそのまま埋め込み -->
    <svg class="artwork"
         xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 750 1624"
         role="img"
         aria-label="meguru ログイン画面">

      <defs>
        <style>
          .cls-1 {
            fill: none;
            stroke-width: 3px;
          }

          .cls-1, .cls-2 {
            stroke: #8b6f55;
            stroke-miterlimit: 10;
          }

          .cls-3, .cls-4, .cls-5 {
            font-family: "Zen Maru Gothic", sans-serif;
          }

          .cls-3, .cls-4, .cls-6, .cls-7, .cls-8 {
            fill: #8b6f55;
          }

          .cls-3, .cls-5 {
            font-size: 35px;
          }

          .cls-4, .cls-8 {
            font-size: 20px;
          }

          .cls-2, .cls-5, .cls-9 {
            fill: #fff;
          }

          .cls-10 {
            letter-spacing: -.5em;
          }

          .cls-7 {
            font-size: 60px;
          }

          .cls-7, .cls-8 {
            font-family: "Zen Maru Gothic", sans-serif;
            font-weight: 700;
          }

          .cls-11 {
            fill: #f4eee5;
          }
        </style>
      </defs>

      <g id="_固定" data-name="固定">
        <rect class="cls-11" width="750" height="1624"/>

        <g>
          <circle class="cls-6" cx="369.77" cy="419.29" r="45.31"/>
          <g>
            <circle class="cls-9" cx="369.77" cy="407.41" r="11.62"/>
            <path class="cls-9" d="M387.08,442.78h-34.62c0-11.78,7.75-21.33,17.3-21.33S387.08,431,387.08,442.78Z"/>
          </g>
        </g>

        <text class="cls-7" transform="translate(276.6 229.8)">
          <tspan x="0" y="0">meguru</tspan>
        </text>

        <text class="cls-4" transform="translate(280 291.43)">
          <tspan x="0" y="0">思い出を、少しずつ</tspan>
          <tspan class="cls-10" x="180" y="0">。</tspan>
          <tspan x="-30" y="35">あなたの日々を、ここから</tspan>
          <tspan class="cls-10" x="210" y="35">。</tspan>
        </text>

        <text class="cls-8" transform="translate(92.14 528.56)">
          <tspan x="0" y="0">メールアドレス</tspan>
        </text>

        <text class="cls-8" transform="translate(92.14 669.11)">
          <tspan x="0" y="0">パスワード</tspan>
        </text>

        <text class="cls-8" transform="translate(120 962.36)">
          <tspan x="0" y="0">アカウントをお持ちでない方は新規登録をしてください</tspan>
          <tspan class="cls-10" x="500" y="0">。</tspan>
        </text>
      </g>

      <g id="_メアド入力" data-name="メアド入力">
        <rect class="cls-2" x="92.14" y="552.32"
              width="565.73" height="79.42" rx="12" ry="12"/>
      </g>

      <g id="_パスワード入力" data-name="パスワード入力">
        <rect class="cls-2" x="92.14" y="692.87"
              width="565.73" height="79.42" rx="12" ry="12"/>
      </g>

      <g id="_ログイン" data-name="ログイン">
        <g>
          <rect class="cls-6" x="101.52" y="835.04"
                width="245.02" height="78.76" rx="12" ry="12"/>
          <text class="cls-5" transform="translate(154.03 887.54)">
            <tspan x="0" y="0">ログイン</tspan>
          </text>
        </g>
      </g>

      <g id="_新規登録" data-name="新規登録">
        <g>
          <text class="cls-3" transform="translate(455.94 886.01)">
            <tspan x="0" y="0">新規登録</tspan>
          </text>
          <rect class="cls-1" x="403.46" y="835.04"
                width="245.02" height="78.76" rx="12" ry="12"/>
        </g>
      </g>
    </svg>

    <!-- メールアドレス入力 -->
    <input
      class="field"
      id="email"
      type="email"
      autocomplete="email"
      aria-label="メールアドレス"
      required
    >

    <!-- パスワード入力 -->
    <input
      class="field"
      id="password"
      type="password"
      autocomplete="current-password"
      aria-label="パスワード"
      required
    >

    <button
      class="password-toggle"
      id="passwordToggle"
      type="button"
      aria-label="パスワードを表示"
      aria-pressed="false"
    >表示</button>

    <!-- SVG上のボタン位置に透明な操作領域を配置 -->
    <button
      class="action"
      id="loginButton"
      type="button"
      aria-label="ログイン">
    </button>

    <button
      class="action"
      id="signupButton"
      type="button"
      aria-label="新規登録">
    </button>

    <p class="status" id="status" role="status" aria-live="polite"></p>

  </main>

  <!-- 結果表示ダイアログ -->
  <dialog id="messageDialog">
    <p id="dialogMessage"></p>
    <button id="dialogClose" type="button">閉じる</button>
  </dialog>

  <script>
    // ==========================================
    // Supabase 接続設定
    // ==========================================

    // Supabase Dashboard > Project Settings > API
    // Project URL は設定済みです。
    // Publishable Key（sb_publishable_...）を下に貼り付けてください。
    // Secret Key（sb_secret_...）は絶対に貼り付けないでください。
    // Secret KeyをHTMLに入れると第三者に見られる危険があります。

    const SUPABASE_URL =
      'https://vhzxwnyxgmtgteatgwcj.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_zFptSnTXIBaVQFCeYairJQ_WAx6ZL1L';


    // ==========================================
    // 初期設定
    // ==========================================

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('passwordToggle');

    const dialog = document.getElementById('messageDialog');
    const dialogMessage = document.getElementById('dialogMessage');

    const status = document.getElementById('status');

    const loginButton = document.getElementById('loginButton');
    const signupButton = document.getElementById('signupButton');

    let supabaseClient = null;


    // ==========================================
    // ダイアログ表示
    // ==========================================

    function showMessage(message) {
      dialogMessage.textContent = message;

      if (typeof dialog.showModal === 'function') {
        dialog.showModal();
      } else {
        window.alert(message);
      }
    }


    // ==========================================
    // Supabase接続
    // ==========================================

    function getClient() {

      if (
        !SUPABASE_PUBLISHABLE_KEY ||
        SUPABASE_PUBLISHABLE_KEY.startsWith('ここに')
      ) {
        showMessage(
          'SupabaseのPublishable Keyが設定されていません。\n' +
          'HTML内の設定欄にキーを貼り付けてください。'
        );
        return null;
      }

      if (!window.supabase) {
        showMessage(
          '認証ライブラリを読み込めませんでした。\n' +
          'インターネット接続を確認してください。'
        );
        return null;
      }

      if (!supabaseClient) {
        supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        );
      }

      return supabaseClient;
    }


    // ==========================================
    // 入力内容の確認
    // ==========================================

    function getCredentials() {

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage(
          'メールアドレスとパスワードを入力してください。'
        );
        return null;
      }

      if (!emailInput.checkValidity()) {
        showMessage(
          'メールアドレスの形式を確認してください。'
        );
        return null;
      }

      return {
        email,
        password
      };
    }


    // ==========================================
    // ログイン
    // ==========================================

    loginButton.addEventListener('click', async () => {

      const credentials = getCredentials();
      if (!credentials) return;

      const client = getClient();
      if (!client) return;

      loginButton.disabled = true;
      signupButton.disabled = true;

      status.textContent = 'ログインしています';

      try {

        const { error } =
          await client.auth.signInWithPassword(credentials);

        if (error) throw error;

        window.location.href = 'index.html';

      } catch (error) {

        showMessage(
          'ログインできませんでした。\n' +
          'メールアドレスとパスワードを確認してください。\n\n' +
          (error.message || 'エラーが発生しました。')

        );

      } finally {

        loginButton.disabled = false;
        signupButton.disabled = false;
        status.textContent = '';

      }
    });


    // ==========================================
    // 新規登録
    // ==========================================

    signupButton.addEventListener('click', async () => {

      const credentials = getCredentials();
      if (!credentials) return;

      if (credentials.password.length < 6) {
        showMessage(
          'パスワードは6文字以上で入力してください。'
        );
        return;
      }

      const client = getClient();
      if (!client) return;

      loginButton.disabled = true;
      signupButton.disabled = true;

      status.textContent = 'アカウントを作成しています';

      try {

        const { data, error } =
          await client.auth.signUp(credentials);

        if (error) throw error;

        if (data.session) {

          showMessage(
            '新規登録が完了しました。'
          );

          window.setTimeout(() => {
            window.location.href = 'index.html';
          }, 900);

        } else {

          showMessage(
            '登録を受け付けました。\n' +
            '確認メールが届いた場合は、メール内のリンクから登録を完了してください。'
          );

        }

      } catch (error) {

        showMessage(
          '新規登録できませんでした。\n' +
          '入力内容を確認してください。\n\n' +
          (error.message || 'エラーが発生しました。')
        );

      } finally {

        loginButton.disabled = false;
        signupButton.disabled = false;
        status.textContent = '';

      }
    });


    // ==========================================
    // パスワードの表示・非表示
    // ==========================================

    passwordToggle.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';

      passwordInput.type = isHidden ? 'text' : 'password';
      passwordToggle.textContent = isHidden ? '隠す' : '表示';
      passwordToggle.setAttribute('aria-label',
        isHidden ? 'パスワードを隠す' : 'パスワードを表示'
      );
      passwordToggle.setAttribute('aria-pressed', String(isHidden));
      passwordInput.focus();
    });


    // ==========================================
    // ダイアログを閉じる
    // ==========================================

    document.getElementById('dialogClose')
      .addEventListener('click', () => {
        dialog.close();
      });


    // Enterキーでログイン
    [emailInput, passwordInput].forEach((input) => {

      input.addEventListener('keydown', (event) => {

        if (event.key === 'Enter') {
          loginButton.click();
        }

      });

    });

  </script>

</body>
</html>
