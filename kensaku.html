<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>日記を探す｜めぐる</title>

  <!-- Supabase JavaScript SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 共通メニュー -->
  <link rel="stylesheet" href="menu.css">
  <script src="menu.js" defer></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --brown: #8b6f55;
      --light-brown: #d8c3a5;
      --cream: #f4eee5;
      --text: #5f5145;
      --white: #fff;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--cream);
      color: var(--text);
      font-family: "Zen Maru Gothic", sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
      overflow: hidden;
      font-weight: 400;
      font-synthesis: none;
    }

    button, input {
      font: inherit;
    }

    /* emotion.html / mypage.html と共通の画面全体レイアウト */
    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      max-width: 600px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      background: var(--cream);
    }

    /* emotion.html と同じヘッダー領域 */
    header {
      height: 70px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 10;
    }

    .header-menu-svg {
      height: 36px;
      width: auto;
    }

    #_メニュー {
      cursor: pointer;
      touch-action: manipulation;
    }

    /* メイン領域：ヘッダーとフッターの間でスクロール */
    main {
      flex: 1;
      min-height: 0;
      width: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 8px 24px 28px;
    }

    .page-title {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 700;
      color: var(--brown);
    }

    .page-description {
      margin: 0 0 22px;
      font-size: 13px;
      color: #978575;
      line-height: 1.8;
    }

    .search-area {
      display: flex;
      gap: 9px;
      margin-bottom: 26px;
    }

    .search-input {
      min-width: 0;
      flex: 1;
      height: 48px;
      padding: 0 16px;
      border: 1.5px solid var(--light-brown);
      border-radius: 12px;
      outline: none;
      background: white;
      color: var(--text);
      font-size: 14px;
    }

    .search-input:focus {
      border-color: var(--brown);
    }

    .search-input::placeholder {
      color: #b9aa9b;
    }

    .search-button {
      width: 84px;
      flex-shrink: 0;
      border: none;
      border-radius: 12px;
      background: var(--brown);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .search-button:disabled,
    .more-button:disabled {
      opacity: .55;
      cursor: default;
    }

    .result-heading {
      margin: 0 0 14px;
      font-size: 15px;
      font-weight: 600;
      color: var(--brown);
    }

    .result-count {
      margin-left: 7px;
      font-size: 12px;
      color: #a18e7b;
      font-weight: 400;
    }

    .result-list {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .diary-card {
      width: 100%;
      padding: 17px 19px;
      border: 1px solid #e4d6c5;
      border-radius: 15px;
      background: white;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      transition: border-color .2s, transform .2s;
    }

    .diary-card:hover {
      border-color: var(--brown);
      transform: translateY(-1px);
    }

    .diary-date {
      display: block;
      margin-bottom: 9px;
      font-size: 13px;
      font-weight: 600;
      color: var(--brown);
    }

    .diary-excerpt {
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      font-size: 14px;
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .diary-emotion {
      display: inline-block;
      margin-top: 13px;
      padding: 4px 11px;
      border-radius: 20px;
      background: var(--cream);
      color: #927b63;
      font-size: 11px;
    }

    .message {
      padding: 35px 15px;
      text-align: center;
      color: #a18e7b;
      font-size: 13px;
      line-height: 1.9;
    }

    .more-area {
      margin-top: 25px;
      text-align: center;
    }

    .more-button {
      padding: 11px 30px;
      border: 1px solid var(--light-brown);
      border-radius: 25px;
      background: white;
      color: var(--brown);
      cursor: pointer;
      font-size: 13px;
    }

    .more-button:hover {
      background: var(--cream);
    }

    /* mypage.html / index.html と同じフッター設定 */
    footer {
      height: 80px;
      padding: 0 32px calc(12px + env(safe-area-inset-bottom, 0px));
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--cream);
      z-index: 10;
    }

    .footer-svg {
      width: 100%;
      height: 50px;
    }

    svg [role="button"] {
      cursor: pointer;
    }

    #_ホーム, #_カレンダー, #_マイページ, #_検索 {
      cursor: pointer;
      pointer-events: all;
    }

    /* 日記全文ダイアログ */
    .dialog-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(48, 39, 31, .38);
    }

    .dialog-backdrop.is-open {
      display: flex;
    }

    .dialog {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-weight: 400;
      font-synthesis: none;
      width: min(100%, 420px);
      max-height: 85vh;
      overflow-y: auto;
      padding: 28px 24px;
      border-radius: 14px;
      background: #fbf8f2;
      border: 1px solid #d8c3a5;
      box-shadow: 0 8px 28px rgba(50, 35, 20, .18);
    }

    .dialog-date {
      margin: 0 0 10px;
      color: var(--brown);
      font-size: 18px;
      font-weight: 700;
    }

    .dialog-emotion {
      display: inline-block;
      margin-bottom: 16px;
      padding: 5px 13px;
      border-radius: 20px;
      background: #f2eadf;
      color: #927b63;
      font-size: 12px;
    }

    .dialog-content {
      margin: 0;
      padding: 16px 0;
      border-top: 1px solid #d8c3a5;
      color: #5f4b3a;
      font-size: 14px;
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .dialog-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    .dialog button {
      font-family: inherit;
      font-weight: 500;
      min-width: 112px;
      padding: 10px 18px;
      border-radius: 7px;
      border: 1px solid #9b8064;
      background: #9b8064;
      color: white;
      cursor: pointer;
    }

    .dialog button:focus-visible {
      outline: 2px solid #8b6f55;
      outline-offset: 2px;
    }

    @media (max-width: 480px) {
      main {
        padding: 4px 18px 24px;
      }

      .page-title {
        font-size: 22px;
      }

      .dialog {
        padding: 24px 18px;
      }
    }
  </style>
</head>

  <!-- 日記全文ダイアログ -->
  <div class="dialog-backdrop" id="detailDialog" role="presentation">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogDate">
      <h2 class="dialog-date" id="dialogDate"></h2>
      <span class="dialog-emotion" id="dialogEmotion"></span>
      <p class="dialog-content" id="dialogContent"></p>
      <div class="dialog-actions">
        <button type="button" id="closeDialog">閉じる</button>
      </div>
    </section>
  </div>

  <script>
    const SUPABASE_URL = "https://vhzxwnyxgmtgteatgwcj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_zFptSnTXIBaVQFCeYairJQ_WAx6ZL1L";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const PAGE_URLS = {
      home: "index.html",
      calendar: "calendar.html",
      mypage: "mypage.html",
      search: "kensaku.html"
    };

    const PAGE_SIZE = 20;

    const EMOTION_NAMES = {
      hokkori: "ほっこり",
      massara: "まっさら",
      ukiuki: "うきうき",
      meramera: "めらめら",
      sowasowa: "そわそわ",
      punpun: "ぷんぷん",
      moyamoya: "もやもや",
      shinmiri: "しんみり",
      gakkuri: "がっくり",
      hetahhe: "へとへと"
    };

    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const resultList = document.getElementById("resultList");
    const resultHeading = document.getElementById("resultHeading");
    const resultCount = document.getElementById("resultCount");
    const moreArea = document.getElementById("moreArea");
    const moreButton = document.getElementById("moreButton");

    const detailDialog = document.getElementById("detailDialog");
    const dialogDate = document.getElementById("dialogDate");
    const dialogEmotion = document.getElementById("dialogEmotion");
    const dialogContent = document.getElementById("dialogContent");

    let currentUser = null;
    let currentKeyword = "";
    let currentOffset = 0;
    let totalCount = 0;
    let isSearching = false;

    function addClick(id, label, callback) {
      const element = document.getElementById(id);
      if (!element) return;
      element.setAttribute("role", "button");
      element.setAttribute("tabindex", "0");
      element.setAttribute("aria-label", label);
      element.addEventListener("click", callback);
      element.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          callback();
        }
      });
    }

    // emotion.html と同じメニュー起動処理
    addClick("_メニュー", "メニュー", () => {
      if (typeof window.openMenu === "function") {
        window.openMenu();
      }
    });

    // mypage.html と同じフッターナビゲーション
    addClick("_ホーム", "ホーム", () => window.location.href = PAGE_URLS.home);
    addClick("_カレンダー", "カレンダー", () => window.location.href = PAGE_URLS.calendar);
    addClick("_検索", "検索", () => window.location.href = PAGE_URLS.search);
    addClick("_マイページ", "マイページ", () => window.location.href = PAGE_URLS.mypage);

    function formatDate(dateString) {
      if (!dateString) return "";
      const [year, month, day] = dateString.split("-");
      return `${year}年${Number(month)}月${Number(day)}日`;
    }

    function showMessage(message) {
      resultList.innerHTML = "";
      const div = document.createElement("div");
      div.className = "message";
      div.textContent = message;
      resultList.appendChild(div);
    }

    function createDiaryCard(diary) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "diary-card";

      const date = document.createElement("span");
      date.className = "diary-date";
      date.textContent = formatDate(diary.entry_date);

      const excerpt = document.createElement("span");
      excerpt.className = "diary-excerpt";
      excerpt.textContent = diary.content || "";

      button.append(date, excerpt);

      if (diary.emotion_id) {
        const emotion = document.createElement("span");
        emotion.className = "diary-emotion";
        emotion.textContent =
          EMOTION_NAMES[diary.emotion_id] || "感情の記録";
        button.appendChild(emotion);
      }

      button.addEventListener("click", () => {
        openDiary(diary);
      });

      return button;
    }

    function openDiary(diary) {
      dialogDate.textContent = formatDate(diary.entry_date);
      dialogContent.textContent = diary.content || "";

      if (diary.emotion_id) {
        dialogEmotion.textContent =
          EMOTION_NAMES[diary.emotion_id] || "感情の記録";
        dialogEmotion.style.display = "inline-block";
      } else {
        dialogEmotion.style.display = "none";
      }

      detailDialog.classList.add("is-open");
      const closeBtn = document.getElementById("closeDialog");
      if (closeBtn) closeBtn.focus();
    }

    function closeDiary() {
      detailDialog.classList.remove("is-open");
    }

    document.getElementById("closeDialog").addEventListener("click", closeDiary);

    detailDialog.addEventListener("click", (event) => {
      if (event.target === detailDialog) {
        closeDiary();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeDiary();
      }
    });

    async function searchDiaries(isNewSearch = true) {
      if (!currentUser || isSearching) return;

      if (isNewSearch) {
        currentKeyword = searchInput.value.trim();
        currentOffset = 0;
        totalCount = 0;
        resultList.innerHTML = "";
      }

      if (!currentKeyword) {
        resultHeading.hidden = true;
        moreArea.hidden = true;
        showMessage("探したい言葉を入力してください。");
        return;
      }

      isSearching = true;
      searchButton.disabled = true;
      moreButton.disabled = true;

      if (isNewSearch) {
        showMessage("日記を探しています…");
      }

      try {
        const safeKeyword = currentKeyword.replace(/[%_]/g, "");

        if (!safeKeyword) {
          resultHeading.hidden = true;
          moreArea.hidden = true;
          showMessage("検索できる文字を入力してください。");
          return;
        }

        const { data, error, count } = await supabaseClient
          .from("diaries")
          .select("entry_date, emotion_id, content", { count: "exact" })
          .eq("user_id", currentUser.id)
          .not("content", "is", null)
          .ilike("content", `%${safeKeyword}%`)
          .order("entry_date", { ascending: false })
          .range(currentOffset, currentOffset + PAGE_SIZE - 1);

        if (error) throw error;

        totalCount = count || 0;

        if (isNewSearch) {
          resultList.innerHTML = "";
        }

        if (!data || data.length === 0) {
          if (isNewSearch) {
            showMessage("該当する日記は見つかりませんでした。");
          }
        } else {
          data.forEach((diary) => {
            resultList.appendChild(createDiaryCard(diary));
          });
        }

        resultHeading.hidden = false;
        resultCount.textContent = `${totalCount}件`;

        currentOffset += data ? data.length : 0;
        moreArea.hidden = currentOffset >= totalCount;

      } catch (error) {
        console.error("日記検索エラー:", error);
        showMessage("日記を読み込めませんでした。通信状態を確認してください。");
        moreArea.hidden = true;
      } finally {
        isSearching = false;
        searchButton.disabled = false;
        moreButton.disabled = false;
      }
    }

    searchButton.addEventListener("click", () => {
      searchDiaries(true);
    });

    searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.isComposing) {
        searchDiaries(true);
      }
    });

    moreButton.addEventListener("click", () => {
      searchDiaries(false);
    });

    // ログイン確認
    async function initialize() {
      try {
        const { data, error } = await supabaseClient.auth.getUser();

        if (error || !data.user) {
          location.href = "login.html";
          return;
        }

        currentUser = data.user;
        searchButton.disabled = false;
      } catch (error) {
        console.error("認証確認エラー:", error);
        location.href = "login.html";
      }
    }

    initialize();
  </script>
</body>
</html>
