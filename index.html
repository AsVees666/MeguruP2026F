<script>
(() => {
  "use strict";

  const NS = "http://www.w3.org/2000/svg";

  const SUPABASE_URL = "https://vhzxwnyxgmtgteatgwcj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_zFptSnTXIBaVQFCeYairJQ_WAx6ZL1L";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const PAGES = {
    home: "index.html",
    record: "emotion.html",
    search: "kensaku.html",
    mypage: "mypage.html",
    calendar: "calendar.html",
    diary: "record.html",
    kiroku: "kiroku.html"
  };

  function localDateString() {
    const date = new Date();
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  function displayDate(date) {
    return date.replaceAll("-", ".");
  }

  function navigate(page, params = {}) {
    const url = new URL(PAGES[page], location.href);

    Object.entries(params).forEach(([key, value]) => {
      url.searchParams.set(key, value);
    });

    location.href = url.href;
  }

  function setText(groupId, value) {
    const group = document.getElementById(groupId);
    const text = group?.querySelector("text");

    if (!text) return;

    const tspan = text.querySelector("tspan");

    if (tspan) {
      tspan.textContent = value;
    } else {
      text.textContent = value;
    }
  }

  function addImage(groupId, src, label) {
    const group = document.getElementById(groupId);
    const rect = group?.querySelector("rect");

    if (!group || !rect) return;

    if (group.querySelector(".dynamic-mark")) return;

    const image = document.createElementNS(NS, "image");

    image.classList.add("dynamic-mark");
    image.setAttribute("x", rect.getAttribute("x"));
    image.setAttribute("y", rect.getAttribute("y"));
    image.setAttribute("width", rect.getAttribute("width"));
    image.setAttribute("height", rect.getAttribute("height"));
    image.setAttribute("preserveAspectRatio", "xMidYMid meet");
    image.setAttribute("href", src);
    image.setAttribute("aria-label", label);
    image.setAttribute("pointer-events", "none");

    group.appendChild(image);
  }

  function setExcerpt(entry) {
  const group = document.getElementById("_テキストボックス");

  if (!group) return;

  group.querySelector(".diary-excerpt")?.remove();

  const text = document.createElementNS(NS, "text");

  text.classList.add("diary-excerpt");
  text.setAttribute("x", "346");
  text.setAttribute("y", "770");
  text.setAttribute("fill", "#8b6f55");
  text.setAttribute("font-family", "'Zen Maru Gothic', sans-serif");
  text.setAttribute("font-weight", "400");
  text.setAttribute("font-size", "18");
  text.setAttribute("pointer-events", "none");

  const content = entry?.content?.trim();

  if (!content) {
    const tspan = document.createElementNS(NS, "tspan");
    tspan.setAttribute("x", "346");
    tspan.textContent = "日記をつけてみましょう";
    text.appendChild(tspan);
  } else {
    const chars = Array.from(content);

    const maxWidth = 235;
    const maxLines = 3;
    const lineHeight = 27;

    let lines = [];
    let currentLine = "";

    // 文字幅を測定するための一時的なテキスト
    const measure = document.createElementNS(NS, "text");
    measure.setAttribute("font-family", "'Zen Maru Gothic', sans-serif");
    measure.setAttribute("font-size", "18");
    measure.style.visibility = "hidden";
    group.appendChild(measure);

    for (const char of chars) {
      measure.textContent = currentLine + char;

      if (
        measure.getComputedTextLength() > maxWidth &&
        currentLine.length > 0
      ) {
        lines.push(currentLine);
        currentLine = char;

        if (lines.length >= maxLines) break;
      } else {
        currentLine += char;
      }
    }

    if (lines.length < maxLines && currentLine) {
      lines.push(currentLine);
    }

    measure.remove();

    // 3行に収まらない場合は末尾を省略
    const displayedCount = lines.join("").length;

    if (displayedCount < chars.length) {
      let lastLine = lines[lines.length - 1];

      while (lastLine.length > 0) {
        const test = document.createElementNS(NS, "text");
        test.setAttribute("font-family", "'Zen Maru Gothic', sans-serif");
        test.setAttribute("font-size", "18");
        test.textContent = lastLine + "…";

        group.appendChild(test);
        const width = test.getComputedTextLength();
        test.remove();

        if (width <= maxWidth) break;

        lastLine = Array.from(lastLine).slice(0, -1).join("");
      }

      lines[lines.length - 1] = lastLine + "…";
    }

    lines.forEach((line, index) => {
      const tspan = document.createElementNS(NS, "tspan");

      tspan.setAttribute("x", "346");

      if (index > 0) {
        tspan.setAttribute("dy", String(lineHeight));
      }

      tspan.textContent = line;
      text.appendChild(tspan);
    });
  }

  const border = group.querySelector("rect");
  group.insertBefore(text, border || null);
}

  function addHitArea(groupId, label, action) {
    const group = document.getElementById(groupId);

    if (!group || group.querySelector(".hit-area")) return;

    let bounds;

    try {
      bounds = group.getBBox();
    } catch (e) {
      return;
    }

    if (!bounds.width || !bounds.height) return;

    const hit = document.createElementNS(NS, "rect");

    hit.classList.add("hit-area");
    hit.setAttribute("x", bounds.x - 8);
    hit.setAttribute("y", bounds.y - 8);
    hit.setAttribute("width", bounds.width + 16);
    hit.setAttribute("height", bounds.height + 16);
    hit.setAttribute("fill", "transparent");
    hit.setAttribute("pointer-events", "all");
    hit.setAttribute("role", "button");
    hit.setAttribute("tabindex", "0");
    hit.setAttribute("aria-label", label);
    hit.style.cursor = "pointer";

    hit.addEventListener("click", action);

    hit.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        action();
      }
    });

    group.appendChild(hit);
  }

  function hasFeeling(entry) {
    return (
      entry.emotion_id !== null &&
      entry.emotion_id !== undefined &&
      entry.emotion_id !== ""
    ) || [
      entry.kirakira,
      entry.hokkori,
      entry.iraira,
      entry.shonbori
    ].some(value => value !== null && value !== undefined);
  }

  function selectReflection(entries, today) {
    if (!entries.length) return null;

    const savedDate = localStorage.getItem("diaryReflectionDate");
    const savedSelectedDate = localStorage.getItem(
      "diaryReflectionEntryDate"
    );

    if (savedDate === today && savedSelectedDate) {
      const existing = entries.find(
        entry => entry.entry_date === savedSelectedDate
      );

      if (existing) return existing;
    }

    let recent = [];

    try {
      recent = JSON.parse(
        localStorage.getItem("diaryRecentReflectionDates") || "[]"
      );

      if (!Array.isArray(recent)) recent = [];
    } catch (e) {
      recent = [];
    }

    let candidates = entries.filter(
      entry => !recent.includes(entry.entry_date)
    );

    if (!candidates.length) candidates = entries;

    const seed = Number(today.replaceAll("-", ""));
    const selected = candidates[seed % candidates.length];

    localStorage.setItem("diaryReflectionDate", today);
    localStorage.setItem(
      "diaryReflectionEntryDate",
      selected.entry_date
    );

    recent = [
      selected.entry_date,
      ...recent.filter(date => date !== selected.entry_date)
    ].slice(0, 5);

    localStorage.setItem(
      "diaryRecentReflectionDates",
      JSON.stringify(recent)
    );

    return selected;
  }

  function hideReflection() {
    document.getElementById("_振り返り日付")
      ?.style.setProperty("display", "none");

    document.getElementById("_マーク位置_振り返り_")
      ?.style.setProperty("display", "none");

    document.getElementById("_感情バーを見るボタン")
      ?.style.setProperty("display", "none");

    document.getElementById("_続きを読む")
      ?.style.setProperty("display", "none");

    setExcerpt(null);
  }

  async function loadReflection(userId, today) {
    const { data, error } = await supabaseClient
      .from("diaries")
      .select(`
        entry_date,
        emotion_id,
        kirakira,
        hokkori,
        iraira,
        shonbori,
        content
      `)
      .eq("user_id", userId)
      .lt("entry_date", today)
      .order("entry_date", { ascending: false });

    if (error) {
      console.error("振り返りデータの取得に失敗しました:", error);
      hideReflection();
      return;
    }

    const eligible = (data || []).filter(entry => {
      const hasBody =
        typeof entry.content === "string" &&
        entry.content.trim().length > 0;

      return hasBody || hasFeeling(entry);
    });

    const entry = selectReflection(eligible, today);

    if (!entry) {
      hideReflection();
      return;
    }

    const hasBody =
      typeof entry.content === "string" &&
      entry.content.trim().length > 0;

    const feeling = document.getElementById(
      "_感情バーを見るボタン"
    );

    const read = document.getElementById("_続きを読む");

    document.getElementById("_振り返り日付")
      ?.style.removeProperty("display");

    setText("_振り返り日付", displayDate(entry.entry_date));

    const markGroup = document.getElementById(
      "_マーク位置_振り返り_"
    );

    markGroup?.style.removeProperty("display");

const emotionImageNames = {
  ukiuki: "うきうき.png",
  hokkori: "ほっこり.png",
  massara: "まっさら.png",
  meramera: "めらめら.png",
  sowasowa: "そわそわ.png",
  punpun: "ぷんぷん.png",
  moyamoya: "もやもや.png",
  shinmiri: "しんみり.png",
  gakkuri: "がっくり.png",
  hetahhe: "へとへと.png"
};

const emotionId = String(entry.emotion_id || "");
const markName = emotionImageNames[emotionId];

if (markName) {
  addImage(
    "_マーク位置_振り返り_",
    markName,
    emotionId
  );
}

    setExcerpt(entry);

    if (feeling) {
      feeling.style.display = hasBody ? "none" : "";
    }

    if (read) {
      read.style.display = hasBody ? "" : "none";
    }

    if (hasBody) {
      addHitArea("_続きを読む", "続きを読む", () => {
        navigate("diary", { date: entry.entry_date });
      });
  } else {
  addHitArea("_感情バーを見るボタン", "感情バーを見る", () => {
    navigate("diary", { date: entry.entry_date });
  });
}
  }

  async function init() {
    const today = localDateString();

    setText(
      "_今日の日付",
      displayDate(today)
    );

    addImage(
      "_マーク位置_画面上部_",
      "marks/固定マーク.png",
      "固定マーク"
    );

    const { data: sessionData, error: sessionError } =
      await supabaseClient.auth.getSession();

    if (sessionError || !sessionData.session) {
      location.replace("login.html");
      return;
    }

    const userId = sessionData.session.user.id;

    await loadReflection(userId, today);

    addHitArea("_ホーム", "ホーム", () =>
      navigate("home")
    );

    addHitArea("_カレンダー", "カレンダー", () =>
      navigate("calendar")
    );

    addHitArea("_検索", "検索", () =>
      navigate("search")
    );

    addHitArea("_マイページ", "マイページ", () =>
      navigate("mypage")
    );

    addHitArea("_メニュー", "メニュー", () => {
      if (typeof window.openMenu === "function") {
        window.openMenu();
      }
    });

    addHitArea("_記録ボタン", "日記を書く", () =>
      navigate("record", {
        date: today,
        mode: "new"
      })
    );
  }

  init();

})();
</script>

</body>
</html>
