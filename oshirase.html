html, body {

/* お知らせ一覧 */

<script>
(() => {
  "use strict";

  const NS = "http://www.w3.org/2000/svg";

  const SUPABASE_URL = "https://vhzxwnyxgmtgteatgwcj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_zFptSnTXIBaVQFCeYairJQ_WAx6ZL1L";
  const ADMIN_USER_ID = "e561c056-67c4-4933-87d8-0cc1d93d76b7";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const PAGES = {
    home: "index.html",
    search: "kensaku.html",
    mypage: "mypage.html",
    calendar: "calendar.html",
    noticeDetail: "お知らせ内容.html",
    noticeNew: "お知らせ投稿.html"
  };

  function navigate(page) {
    location.href = PAGES[page];
  }

  function addHitArea(groupId, label, action) {
    const group = document.getElementById(groupId);
    if (!group || group.querySelector(".hit-area")) return;

    let bounds;

    try {
      bounds = group.getBBox();
    } catch (e) {
      return;
    }

    if (!bounds.width || !bounds.height) return;

    const hit = document.createElementNS(NS, "rect");

    hit.classList.add("hit-area");
    hit.setAttribute("x", bounds.x - 8);
    hit.setAttribute("y", bounds.y - 8);
    hit.setAttribute("width", bounds.width + 16);
    hit.setAttribute("height", bounds.height + 16);
    hit.setAttribute("fill", "transparent");
    hit.setAttribute("pointer-events", "all");
    hit.setAttribute("role", "button");
    hit.setAttribute("tabindex", "0");
    hit.setAttribute("aria-label", label);
    hit.style.cursor = "pointer";

    hit.addEventListener("click", action);

    hit.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        action();
      }
    });

    group.appendChild(hit);
  }

  // 日付を表示用に整える
  function formatDate(dateString) {
    if (!dateString) return "";

    const date = new Date(dateString + "T00:00:00");

    if (Number.isNaN(date.getTime())) return dateString;

    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return `${year}.${month}.${day}`;
  }

  // お知らせカードを1件生成する
  function createNoticeCard(notice) {
    const template = document.getElementById("notice-card-template");
    const card = template.content.firstElementChild.cloneNode(true);

    const title = card.querySelector(".notice-card-title");
    const date = card.querySelector(".notice-card-date");
    const category = card.querySelector(".notice-category");

    title.textContent = notice.title || "";
    date.textContent = formatDate(notice.published_at);
    category.textContent = notice.category || "";

    card.setAttribute("aria-label", notice.title || "お知らせ");

    card.addEventListener("click", () => {
      location.href =
        `${PAGES.noticeDetail}?id=${encodeURIComponent(notice.id)}`;
    });

    return card;
  }

  // Supabaseからお知らせ一覧を取得する
  async function loadNotices() {
    const noticeList = document.getElementById("notice-list");
    noticeList.replaceChildren();

    const { data, error } = await supabaseClient
      .from("notices")
      .select("id, title, category, published_at, content, created_at")
      .order("published_at", { ascending: false })
      .order("created_at", { ascending: false });

    if (error) {
      console.error("お知らせの取得に失敗しました:", error);

      const message = document.createElement("p");
      message.textContent = "お知らせを読み込めませんでした。";
      message.style.textAlign = "center";
      noticeList.appendChild(message);
      return;
    }

    if (!data || data.length === 0) {
      const message = document.createElement("p");
      message.textContent = "現在、お知らせはありません。";
      message.style.textAlign = "center";
      noticeList.appendChild(message);
      return;
    }

    data.forEach(notice => {
      noticeList.appendChild(createNoticeCard(notice));
    });
  }

  async function init() {
    const { data: sessionData, error: sessionError } =
      await supabaseClient.auth.getSession();

    if (sessionError || !sessionData.session) {
      location.replace("login.html");
      return;
    }

    const userId = sessionData.session.user.id;

    if (userId === ADMIN_USER_ID) {
      document.getElementById("admin-area").style.display = "block";
    }

    addHitArea("_メニュー", "メニュー", () => {
      if (typeof window.openMenu === "function") {
        window.openMenu();
      }
    });

    addHitArea("_カレンダー", "カレンダー", () =>
      navigate("calendar")
    );

    addHitArea("_検索", "検索", () =>
      navigate("search")
    );

    addHitArea("_ホーム", "ホーム", () =>
      navigate("home")
    );

    addHitArea("_マイページ", "マイページ", () =>
      navigate("mypage")
    );

    document.getElementById("new-notice-button").addEventListener("click", () =>
      navigate("noticeNew")
    );

    await loadNotices();
  }

  init();
})();
</script>
