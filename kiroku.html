<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日記を書く - めぐる</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="menu.css">
<script src="menu.js" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f4eee5;
  --brown: #8b6f55;
  --line: #d8c3a5;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--brown);
  font-family: "Zen Maru Gothic", sans-serif;
  overflow: hidden;
}

#app {
  width: 100%;
  height: 100dvh;
  min-height: 0;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* ヘッダーを画面上部に固定 */
header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 70px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  background: var(--bg);
  z-index: 20;
}

.header-menu-svg {
  height: 36px;
  width: auto;
  cursor: pointer;
}

/* メイン領域（ヘッダーの分だけ上に余白を取る） */
main {
  width: 100%;
  flex: 1;
  min-height: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  padding: 85px 16px 40px;
}

#stage {
  position: relative;
  width: min(100%, 440px, calc(51.2dvh - 64px));
  aspect-ratio: 584.86 / 1140.42;
  flex-shrink: 0;
}

/* メインSVG背景 */
#design {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  overflow: visible;
}

/* 文章入力エリア（ボックスサイズ固定＆長くなったら中身がスクロール） */
#diaryText {
  position: absolute;
  z-index: 2;

  left: 4%;
  top: 31.15%;
  width: 92%;
  height: 67%;

  margin: 0;
  padding: 18px 8px 25px;

  border: none;
  outline: none;
  resize: none;
  overflow-y: auto; /* ボックス内だけスクロール */

  background: transparent;
  color: var(--brown);

  font-family: "Zen Maru Gothic", sans-serif;
  font-size: 17px;
  font-weight: 400;
  line-height: 1.85;
  letter-spacing: .01em;

  overflow-wrap: anywhere;
}

#diaryText::placeholder {
  color: #b9a895;
  opacity: 1;
}

/* 保存ボタン */
#saveButton {
  position: absolute;
  z-index: 4;
  left: 79.6%;
  top: 23.2%;
  width: 20.4%;
  height: 4%;
  padding: 0;
  border: none;
  border-radius: 30px;
  background: transparent;
  cursor: pointer;
}

#saveButton:disabled {
  opacity: .6;
  cursor: wait;
}

/* SVG風ダイアログ */
.dialog-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(80, 60, 40, .35);
  backdrop-filter: blur(2px);
}

.dialog-overlay.show {
  display: flex;
}

.dialog {
  width: 100%;
  max-width: 360px;
  position: relative;
  padding: 24px 22px;
  border: 2px solid #d8c5ad;
  border-radius: 28px;
  background: #fffdf8;
  box-shadow: 0 8px 24px rgba(80,60,40,.16);
  text-align: center;
}

.dialog::before {
  content: "✦";
  position: absolute;
  top: 12px;
  left: 22px;
  color: #f4d581;
}

.dialog-title {
  font-size: 20px;
  font-weight: 500;
  margin-bottom: 12px;
}

.dialog-message {
  font-size: 15px;
  line-height: 1.9;
  white-space: pre-line;
}

.dialog-actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 22px;
}

.dialog-actions button {
  padding: 10px 15px;
  min-width: 105px;
  border: 1px solid var(--brown);
  border-radius: 24px;
  background: var(--brown);
  color: white;
  font: 500 14px "Zen Maru Gothic", sans-serif;
  cursor: pointer;
}

.dialog-actions button.secondary {
  background: transparent;
  color: var(--brown);
}

#notice {
  position: fixed;
  z-index: 900;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  padding: 10px 18px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: #fffdf8;
  color: var(--brown);
  font-size: 13px;
  text-align: center;
  max-width: 90%;
}

#notice.show {
  display: block;
}

@media(max-width: 480px) {
  #diaryText {
    font-size: 16px;
    padding-top: 16px;
  }
}
</style>
</head>

<body>
<div id="app">

  <!-- 共通ヘッダー（固定） -->
  <header>
    <svg class="header-menu-svg" viewBox="30 70 70 60" xmlns="http://www.w3.org/2000/svg">
      <g id="_メニュー" data-name="メニュー" role="button" aria-label="メニュー" style="cursor: pointer;">
        <rect fill="transparent" x="30" y="70" width="70" height="60"/>
        <line stroke="#8b6f55" stroke-width="3" stroke-linecap="round" stroke-miterlimit="10" fill="none" x1="40" y1="84.22" x2="88.33" y2="84.22"/>
        <line stroke="#8b6f55" stroke-width="3" stroke-linecap="round" stroke-miterlimit="10" fill="none" x1="40" y1="101.2" x2="88.33" y2="101.2"/>
        <line stroke="#8b6f55" stroke-width="3" stroke-linecap="round" stroke-miterlimit="10" fill="none" x1="40" y1="118.18" x2="88.33" y2="118.18"/>
      </g>
    </svg>
  </header>

  <main>
    <div id="stage">

      <!-- ダーリンのSVGデザイン（元の綺麗な比率とスケーリングに戻す） -->
      <svg
        id="design"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 584.86 1140.42"
        preserveAspectRatio="xMidYMid meet"
      >
        <defs>
          <style>
            .paper {
              fill: #fff;
              stroke: #d8c3a5;
              stroke-width: 3px;
            }
            .save-bg {
              fill: #8b6f55;
            }
            .save-text {
              font-family: "Zen Maru Gothic", sans-serif;
              font-size: 25px;
              fill: #fff;
            }
          </style>
        </defs>

        <rect
          class="paper"
          x="1.5"
          y="338.13"
          width="572.26"
          height="800.79"
          rx="14.29"
          ry="14.29"
        />

        <rect
          class="save-bg"
          x="465.77"
          y="264.49"
          width="119.09"
          height="44.44"
          rx="22.22"
          ry="22.22"
        />

        <text
          class="save-text"
          transform="translate(500.31 295.95)"
        >
          <tspan x="0" y="0">保存</tspan>
        </text>

        <image
          id="emotionMark"
          x="136.4"
          y="0"
          width="302.46"
          height="302.46"
          preserveAspectRatio="xMidYMid meet"
          visibility="hidden"
        />
      </svg>

      <textarea
        id="diaryText"
        placeholder="今日の出来事や、感じたことを書いてみよう。"
        aria-label="日記本文"
        spellcheck="false"
      ></textarea>

      <button
        id="saveButton"
        type="button"
        aria-label="保存"
      ></button>

    </div>
  </main>
</div>

<!-- ダイアログ -->
<div class="dialog-overlay" id="dialogOverlay">
  <div class="dialog">
    <div class="dialog-title" id="dialogTitle">お知らせ</div>
    <div class="dialog-message" id="dialogMessage"></div>
    <div class="dialog-actions" id="dialogActions"></div>
  </div>
</div>

<div id="notice" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  /* Supabase */
  const SUPABASE_URL =
    "https://vhzxwnyxgmtgteatgwcj.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_zFptSnTXIBaVQFCeYairJQ_WAx6ZL1L";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  /* 感情IDと画像名 */
  const MARK_NAMES = {
    hokkori: "ほっこり",
    massara: "まっさら",
    ukiuki: "うきうき",
    meramera: "めらめら",
    sowasowa: "そわそわ",
    punpun: "ぷんぷん",
    moyamoya: "もやもや",
    shinmiri: "しんみり",
    gakkuri: "がっくり",
    hetahhe: "へとへと"
  };

  const editor = document.getElementById("diaryText");
  const markImage = document.getElementById("emotionMark");
  const saveButton = document.getElementById("saveButton");

  const overlay = document.getElementById("dialogOverlay");
  const dialogTitle = document.getElementById("dialogTitle");
  const dialogMessage = document.getElementById("dialogMessage");
  const dialogActions = document.getElementById("dialogActions");

  const notice = document.getElementById("notice");

  let currentUser = null;
  let recordDate = "";
  let savedContent = "";
  let isSaving = false;
  let noticeTimer = null;

  function getToday() {
    const now = new Date();

    return (
      now.getFullYear() + "-" +
      String(now.getMonth() + 1).padStart(2, "0") + "-" +
      String(now.getDate()).padStart(2, "0")
    );
  }

  function getDraftKey() {
    return "meguru-draft-" + currentUser.id + "-" + recordDate;
  }

  function showNotice(message, duration = 2500) {
    notice.textContent = message;
    notice.classList.add("show");

    clearTimeout(noticeTimer);

    noticeTimer = setTimeout(() => {
      notice.classList.remove("show");
    }, duration);
  }

  function showDialog(title, message, buttons) {
    return new Promise(resolve => {
      dialogTitle.textContent = title;
      dialogMessage.textContent = message;
      dialogActions.replaceChildren();

      buttons.forEach(item => {
        const button = document.createElement("button");

        button.textContent = item.label;

        if (item.secondary) {
          button.classList.add("secondary");
        }

        button.addEventListener("click", async () => {
          overlay.classList.remove("show");
          dialogActions.replaceChildren();

          const result = await item.action();
          resolve(result);
        });

        dialogActions.appendChild(button);
      });

      overlay.classList.add("show");
    });
  }

  function hasChanges() {
    return editor.value !== savedContent;
  }

  /* 下書きの自動保存 */
  function saveDraft() {
    if (!currentUser || !recordDate) return;

    try {
      if (hasChanges()) {
        localStorage.setItem(getDraftKey(), editor.value);
      } else {
        localStorage.removeItem(getDraftKey());
      }
    } catch (error) {
      console.warn("下書きを保存できませんでした", error);
    }
  }

  editor.addEventListener("input", () => {
    saveDraft();
  });

  /* 感情マーク表示 */
  function showEmotionMark(emotionId) {
    const name = MARK_NAMES[emotionId];

    if (!name) return;

    const filename = name.normalize("NFD") + ".png";

    markImage.setAttribute(
      "href",
      "marks/" + filename
    );

    markImage.setAttribute("visibility", "visible");
  }

  /* 初期読み込み */
  async function initialize() {
    try {
      const { data, error } =
        await supabaseClient.auth.getUser();

      if (error) throw error;

      currentUser = data.user;

      if (!currentUser) {
        location.replace("login.html");
        return;
      }

      recordDate = getToday();

      const { data: record, error: recordError } =
        await supabaseClient
          .from("diaries")
          .select("emotion_id, content")
          .eq("user_id", currentUser.id)
          .eq("entry_date", recordDate)
          .maybeSingle();

      if (recordError) throw recordError;

      if (!record || !record.emotion_id) {
        await showDialog(
          "感情記録がありません",
          "先に今日の感情を記録してください。",
          [{
            label: "感情を記録する",
            action: async () => {
              location.replace("emotion.html");
            }
          }]
        );

        editor.disabled = true;
        saveButton.disabled = true;
        return;
      }

      /* 今日の感情マーク */
      showEmotionMark(record.emotion_id);

      savedContent = record.content || "";

      /* 下書きがあれば復元 */
      let initialContent = savedContent;

      const draft = localStorage.getItem(getDraftKey());

      if (draft !== null && draft !== savedContent) {
        initialContent = draft;

        showNotice("保存前の文章を復元しました。");
      }

      editor.value = initialContent;

    } catch (error) {
      console.error(error);

      await showDialog(
        "読み込みエラー",
        "日記を読み込めませんでした。\n通信状態を確認してください。",
        [{
          label: "OK",
          action: async () => {}
        }]
      );
    }
  }

  /* Supabaseに文章を保存 */
  async function saveDiary() {
    if (isSaving) return false;

    isSaving = true;
    saveButton.disabled = true;

    showNotice("日記を保存しています…", 10000);

    try {
      const { data, error } = await supabaseClient
        .from("diaries")
        .update({
          content: editor.value
        })
        .eq("user_id", currentUser.id)
        .eq("entry_date", recordDate)
        .select("entry_date")
        .maybeSingle();

      if (error) throw error;

      if (!data) {
        throw new Error("保存対象の日記が見つかりません。");
      }

      savedContent = editor.value;

      localStorage.removeItem(getDraftKey());

      showNotice("日記を保存しました。");

      return true;

    } catch (error) {
      console.error("保存エラー:", error);

      showNotice(
        "保存できませんでした。下書きは端末に残しています。",
        4000
      );

      return false;

    } finally {
      isSaving = false;
      saveButton.disabled = false;
    }
  }

  saveButton.addEventListener("click", async () => {
    if (!currentUser) return;

    const success = await saveDiary();

    if (success) {
      await showDialog(
        "保存しました",
        "今日の日記を残しました。",
        [{
          label: "OK",
          action: async () => {}
        }]
      );
    }
  });

  /* メニューを開く前の確認 */
  async function openMenuSafely() {
    if (!hasChanges()) {
      if (typeof window.openMenu === "function") {
        window.openMenu();
      }
      return;
    }

    await showDialog(
      "まだ保存されていません",
      "メニューへ移動する前に、日記を保存しますか？",
      [
        {
          label: "書き続ける",
          secondary: true,
          action: async () => {}
        },
        {
          label: "保存せず移動",
          action: async () => {
            if (typeof window.openMenu === "function") {
              window.openMenu();
            }
          }
        },
        {
          label: "保存して移動",
          action: async () => {
            const success = await saveDiary();

            if (success && typeof window.openMenu === "function") {
              window.openMenu();
            }
          }
        }
      ]
    );
  }

  const menuButton = document.getElementById("_メニュー");

  if (menuButton) {
    menuButton.addEventListener("click", openMenuSafely);
    menuButton.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openMenuSafely();
      }
    });
  }

  /* ブラウザを閉じる・更新する場合の警告 */
  window.addEventListener("beforeunload", event => {
    if (hasChanges()) {
      event.preventDefault();
      event.returnValue = "";
    }
  });

  initialize();

})();
</script>
</body>
</html>
