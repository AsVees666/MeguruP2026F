<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日記 - カレンダー</title>

<!-- メニューオーバーレイの設定 -->
<link rel="stylesheet" href="menu.css">
<script src="menu.js" defer></script>

<!-- Google Fonts：Zen Maru Gothicを読み込む -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #f4eee5;
  font-family: 'Zen Maru Gothic', sans-serif;
  color: #8b6f55;
}

/* アプリ全体のフレックスレイアウト（ホーム画面と完全同一） */
#app {
  display: flex;
  flex-direction: column;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  max-width: 600px;
  margin: 0 auto;
  position: relative;
  background: #f4eee5;
}

/* ヘッダー領域（ホーム画面 index.html と完全統一） */
header {
  height: 70px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 10;
  position: relative;
  width: 100%;
}

/* メニュー：index.html と同じ 36px 基準 */
.header-menu-svg {
  height: 36px;
  width: auto;
  cursor: pointer;
  display: block;
}

/* 月選択ボタン（右側コンテナ） */
.header-month-container {
  position: relative;
  height: 32px;
  display: flex;
  align-items: center;
}

.header-month-svg {
  height: 32px;
  width: auto;
  display: block;
}

/* 月選択プルダウン（ボタンの上にピッタリ重ねる） */
.month-select {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
  font-size: 16px;
  z-index: 2;
}

/* メインコンテンツ・カレンダー一覧 */
main {
  flex: 1;
  width: 100%;
  padding: 0 16px 40px;
}

.calendar-list {
  width: 100%;
}

.month-calendar {
  width: 100%;
  margin: 0 auto 24px;
}

.month-calendar svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}

/* 日付文字 */
.date-number {
  font-family: "Zen Maru Gothic", sans-serif;
  font-size: 12px;
  font-weight: 500;
  fill: #8b6f55;
  text-anchor: middle;
  dominant-baseline: middle;
}

.date-number.sunday {
  fill: #eb8885;
}

.date-number.saturday {
  fill: #036eb6;
}

/* マーク類 */
.emotion-image, .text-mark {
  pointer-events: none;
}

svg [role="button"], .interactive-btn {
  cursor: pointer;
}
</style>
</head>

<body>
<div id="app">

  <!-- ヘッダー（ホーム画面と完全統一したCSS構造） -->
  <header>
    <!-- メニュー：index.html と全く同じSVG・ViewBox -->
    <svg class="header-menu-svg" viewBox="30 70 70 60" xmlns="http://www.w3.org/2000/svg">
      <g id="_メニュー" data-name="メニュー" role="button" aria-label="メニュー">

              fill: #fff;

  </header>

<script>
(() => {
  "use strict";

// 日記データ
window.diaryRecords = {};

  // 最古の表示月
  const FIRST_YEAR = 2026;
  const FIRST_MONTH = 11;

  // 現在の月
  const today = new Date();
  const currentYear = today.getFullYear();
  const currentMonth = today.getMonth() + 1;

  // 表示できる最終月（翌月）
  let lastDate = new Date(currentYear, currentMonth, 1);
  const firstDate = new Date(FIRST_YEAR, FIRST_MONTH - 1, 1);
  if (lastDate < firstDate) {
    lastDate = firstDate;
  }
  const lastYear = lastDate.getFullYear();
  const lastMonth = lastDate.getMonth() + 1;

  function monthNumber(year, month) {
    return year * 12 + month - 1;
  }

  const firstNumber = monthNumber(FIRST_YEAR, FIRST_MONTH);
  const lastNumber = monthNumber(lastYear, lastMonth);

  const months = [];
  for (let n = firstNumber; n <= lastNumber; n++) {
    const year = Math.floor(n / 12);
    const month = (n % 12) + 1;
    months.push({ year, month });
  }

  const monthSelect = document.getElementById("monthSelect");
  months.forEach(({ year, month }) => {
    const option = document.createElement("option");
    option.value = `${year}-${String(month).padStart(2, "0")}`;
    option.textContent = `${year}年${month}月`;
    monthSelect.appendChild(option);
  });

  const SVG_NS = "http://www.w3.org/2000/svg";

  function createSvgElement(name, attributes = {}) {
    const element = document.createElementNS(SVG_NS, name);
    Object.entries(attributes).forEach(([key, value]) => {
      element.setAttribute(key, value);
    });
    return element;
  }

  function createCalendar(year, month) {
    const template = document.getElementById("calendarTemplate");
    const svg = template.content.querySelector("svg").cloneNode(true);
    const firstDay = new Date(year, month - 1, 1).getDay();
    const daysInMonth = new Date(year, month, 0).getDate();

    svg.querySelector("#yearText").textContent = `${year}年`;
    svg.querySelector("#monthText").textContent = `${month}月`;

    svg.querySelectorAll("#_曜日文字_固定_ text").forEach(text => {
      text.style.fontFamily = '"Zen Maru Gothic", sans-serif';
    });

    svg.querySelector("#_文字日記マーク").replaceChildren();

    for (let day = 1; day <= daysInMonth; day++) {
      const index = firstDay + day - 1;
      const column = index % 7;
      const row = Math.floor(index / 7);

      const cellX = column * 83.99;
      const cellY = 183.37 + row * 98.29;

      const dateKey = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      const record = window.diaryRecords[dateKey];

      const dateText = createSvgElement("text", {
        x: cellX + 33.34 + 17.32 / 2,
        y: cellY + 191.48 - 183.37 + 17.32 / 2,
        class: "date-number"
      });
      dateText.textContent = day;

      if (column === 0) dateText.classList.add("sunday");
      if (column === 6) dateText.classList.add("saturday");

      if (record && record.emotionImage) {
        const image = createSvgElement("image", {
          x: cellX + 15.72,
          y: cellY + 220.65 - 183.37,
          width: 52.55,
          height: 52.55,
          href: record.emotionImage,
          class: "emotion-image",
          preserveAspectRatio: "xMidYMid meet"
        });
        svg.appendChild(image);
      }

      if (record && record.text && record.text.trim() !== "") {
        const mark = createSvgElement("path", {
          d: "M50.78,200.09c.23,6.76-6.93,9.14-11.63,8.01-.23-.07-.46-.16-.68-.24-3.35-1.32-5.67-4.17-5.67-7.48,0-3.94,3.29-7.24,7.7-8.06.23-.04.47-.08.71-.11,6.22-.86,10.99.33,9.72,7.26-.03.21-.09.42-.16.62Z",
          fill: "#adc885",
          transform: `translate(${cellX},${cellY - 183.37})`,
          class: "text-mark"
        });
        svg.appendChild(mark);
      }

      svg.appendChild(dateText);
    }
    return svg;
  }

  const calendarList = document.getElementById("calendarList");
  months.forEach(({ year, month }) => {
    const section = document.createElement("section");
    section.className = "month-calendar";
    section.dataset.month = `${year}-${String(month).padStart(2, "0")}`;
    section.appendChild(createCalendar(year, month));
    calendarList.appendChild(section);
  });

  function updateHeader(year, month) {
    document.getElementById("headerMonthText").textContent = `${year}.${String(month).padStart(2, "0")}`;
  }

  monthSelect.addEventListener("change", () => {
    const [year, month] = monthSelect.value.split("-").map(Number);
    updateHeader(year, month);
    const target = document.querySelector(`.month-calendar[data-month="${monthSelect.value}"]`);
    if (target) {
      target.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  });

  const initialYear = currentYear;
  const initialMonth = currentMonth;
  monthSelect.value = `${initialYear}-${String(initialMonth).padStart(2, "0")}`;
  updateHeader(initialYear, initialMonth);

  window.addEventListener("load", () => {
    const currentSection = document.querySelector(`.month-calendar[data-month="${monthSelect.value}"]`);
    if (currentSection) {
      currentSection.scrollIntoView({ block: "start" });
    }
  });

  // メニュークリックイベント
  const menuBtn = document.getElementById("_メニュー");
  if (menuBtn) {
    menuBtn.addEventListener("click", () => {
      if (typeof window.openMenu === "function") {
        window.openMenu();
      }
    });
  }
})();
</script>
</body>
</html>
