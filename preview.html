<style>
:root {
  --paper: #f4eee5;
  --brown: #8b6f55;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--paper);
  color: var(--brown);
  font-family: "Zen Maru Gothic", sans-serif;
  font-weight: 500;
}

button, select {
  font: inherit;
}

/* アプリ全体のフレックスレイアウト（全体はスクロールしない） */
#app {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  max-width: 600px;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
  background: var(--paper);
}

/* ヘッダー領域 */
header {
  height: 70px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 10;
}

.header-svg {
  height: 36px;
  width: auto;
  display: block;
}

/* メイン領域：画面内に収め、プレビュー枠の中だけ縦スクロール */
main {
  flex: 1;
  min-height: 0;
  width: 100%;
  padding: 4px 16px 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* プレビューUI SVG（デザイン・比率保持） */
.preview-ui {
  position: relative;
  width: min(100%, calc((100dvh - 162px) * 467.5 / 977.88));
  max-width: 467.5px;
  aspect-ratio: 467.5 / 977.88;
  margin: 0 auto;
}

.preview-ui > svg.ui-art {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* 枠線はスクロール領域側で描画するため、下のSVG枠線は隠す */
.preview-ui #_プレビュー枠 {
  display: none;
}

/* プレビュー枠の中だけ縦スクロール（枠内で切れないように余白を確保） */
.preview-window {
  position: absolute;
  left: 0.107%;
  top: 6.733%;
  width: 99.786%;
  height: 65.955%;
  overflow-y: auto;
  overflow-x: hidden;
  border-radius: 12px;
  padding: 12px 20px;
  background: #f3ede4;
  border: 1px solid var(--brown);
  scrollbar-width: thin;
  scrollbar-color: #c8b9a8 transparent;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

.preview-pages {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  width: 100%;
}

.preview-page {
  width: 100%;
  aspect-ratio: 436.54 / 612.28;
  flex-shrink: 0;
  background: #f3ede4;
}

.preview-page svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* SVG上の透明クリック領域 */
.ui-button {
  position: absolute;
  z-index: 2;
  border: 0;
  background: transparent;
  cursor: pointer;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

.period-button {
  left: 63.26%;
  top: 0;
  width: 36.64%;
  height: 4.875%;
}

.print-button {
  left: 47.93%;
  top: 85.256%;
  width: 50.08%;
  height: 6.177%;
}

.pdf-button {
  left: 47.93%;
  top: 93.824%;
  width: 50.08%;
  height: 6.177%;
}

/* フッター領域 */
footer {
  height: 80px;
  padding: 0 32px calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 10;
}

.footer-svg {
  width: 100%;
  height: 50px;
  display: block;
}

svg [role="button"], .interactive-btn {
  cursor: pointer;
}

/* 期間選択ダイアログ */
.dialog-background {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(0, 0, 0, .35);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.dialog-background.show {
  display: flex;
}

.dialog {
  width: 100%;
  max-width: 360px;
  background: #fff;
  border-radius: 16px;
  padding: 24px 20px;
  box-shadow: 0 5px 25px rgba(0, 0, 0, .12);
}

.dialog h2 {
  margin: 0 0 18px;
  font-size: 19px;
  text-align: center;
  color: var(--brown);
}

.dialog label {
  display: block;
  margin: 12px 0 5px;
  font-size: 14px;
  color: var(--brown);
}

.dialog select {
  width: 100%;
  height: 44px;
  border: 1px solid #d7c9b9;
  border-radius: 8px;
  background: #fff;
  color: var(--brown);
  padding: 0 10px;
}

.dialog-actions {
  display: flex;
  gap: 10px;
  margin-top: 22px;
}

.dialog-actions button {
  flex: 1;
  height: 44px;
  border: 0;
  border-radius: 22px;
  cursor: pointer;
}

.cancel-button {
  background: var(--paper);
  color: var(--brown);
}

.apply-button {
  background: var(--brown);
  color: #fff;
}

/* 印刷専用領域（A5縦・余白なし） */
#printOutput {
  display: none;
}

@page {
  size: A5 portrait;
  margin: 0;
}

@media print {
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 148mm !important;
    height: auto !important;
    overflow: visible !important;
    background: #fff !important;
    font-family: "Zen Maru Gothic", sans-serif !important;
  }

  #app,
  .dialog-background {
    display: none !important;
  }

  #printOutput {
    display: block !important;
  }

  .print-page {
    width: 148mm;
    height: 210mm;
    margin: 0;
    padding: 0;
    page-break-after: always;
    break-after: page;
    overflow: hidden;
  }

  .print-page:last-child {
    page-break-after: auto;
    break-after: auto;
  }

  .print-page svg {
    display: block;
    width: 148mm;
    height: 210mm;
  }
}
</style>
</head>

  const FIRST_YEAR = 2026;
  const FIRST_MONTH = 11;

  const EMOTION_IMAGES = {
    ukiuki: "うきうき.png",
    hokkori: "ほっこり.png",
    massara: "まっさら.png",
    meramera: "めらめら.png",
    sowasowa: "そわそわ.png",
    punpun: "ぷんぷん.png",
    moyamoya: "もやもや.png",

  };

  let diaryRecords = {};
  let selectedStart = "";
  let selectedEnd = "";

  function monthString(year, month) {
    return `${year}-${String(month).padStart(2, "0")}`;
  }

  function parseMonth(value) {
    const [year, month] = value.split("-").map(Number);
    return { year, month };
  }

  function getMonthList() {
    const now = new Date();
    const current = new Date(now.getFullYear(), now.getMonth(), 1);
    const first = new Date(FIRST_YEAR, FIRST_MONTH - 1, 1);
    const list = [];
    for (let d = new Date(first); d <= current; d.setMonth(d.getMonth() + 1)) {
      list.push(monthString(d.getFullYear(), d.getMonth() + 1));
    }
    if (!list.length) {
      list.push(monthString(FIRST_YEAR, FIRST_MONTH));
    }
    return list;
  }

  function getInitialMonth() {
    const now = new Date();
    let d = new Date(now.getFullYear(), now.getMonth(), 1);
    if (now.getDate() < 25) {
      d.setMonth(d.getMonth() - 1);
    }
    const first = new Date(FIRST_YEAR, FIRST_MONTH - 1, 1);
    if (d < first) d = first;
    return monthString(d.getFullYear(), d.getMonth() + 1);
  }

  function getMonthsBetween(start, end) {
    const result = [];
    const s = parseMonth(start);
    const e = parseMonth(end);
    const cur = new Date(s.year, s.month - 1, 1);
    const last = new Date(e.year, e.month - 1, 1);
    while (cur <= last) {
      result.push({ year: cur.getFullYear(), month: cur.getMonth() + 1 });
      cur.setMonth(cur.getMonth() + 1);
    }
    return result;
  }

  /* Supabaseから日記データを取得 */
  async function loadDiaryRecords() {
    const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
    if (userError || !user) {
      window.location.href = "login.html";
      return false;
    }

    const { data, error } = await supabaseClient
      .from("diaries")
      .select("entry_date, emotion_id, content")
      .eq("user_id", user.id);

    if (error) {
      console.error("日記の取得に失敗しました:", error);
      alert("日記データを読み込めませんでした。");
      return false;
    }

    diaryRecords = {};
    (data || []).forEach(entry => {
      diaryRecords[entry.entry_date] = {
        emotion_id: entry.emotion_id,
        content: entry.content || ""
      };
    });

    return true;
  }

  function svgEl(name, attrs = {}) {
    const el = document.createElementNS(SVG_NS, name);
    Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
    return el;
  }

  function createMonthSVG(year, month) {
    const parsed = new DOMParser().parseFromString(PRINT_TEMPLATE, "image/svg+xml");
    const svg = parsed.documentElement;
    if (parsed.querySelector("parsererror")) {
      throw new Error("印刷物SVGの解析に失敗しました。");
    }

    svg.setAttribute("xmlns", SVG_NS);
    svg.setAttribute("viewBox", "0 0 436.54 612.28");
    svg.setAttribute("width", "436.54");
    svg.setAttribute("height", "612.28");

    const monthText = svg.querySelector("#_月表示 text");
    if (monthText) {
      monthText.replaceChildren();
      const span = svgEl("tspan", { x: "0", y: "0" });
      span.textContent = `${year}.${String(month).padStart(2, "0")}`;
      monthText.appendChild(span);
    }

    /* ロゴ画像を #_ロゴ 枠内に配置 */
    const logoGroup = svg.querySelector("#_ロゴ");
    const logoRect = logoGroup?.querySelector("rect");
    if (logoGroup && logoRect && LOGO_IMAGE) {
      const lx = Number(logoRect.getAttribute("x") || 192.98);
      const ly = Number(logoRect.getAttribute("y") || 66.09);
      const lw = Number(logoRect.getAttribute("width") || 50.58);
      const lh = Number(logoRect.getAttribute("height") || 50.58);
      logoGroup.replaceChildren();
      const logoImg = svgEl("image", {
        x: lx,
        y: ly,
        width: lw,
        height: lh,
        href: LOGO_IMAGE,
        "data-overlay": "true",
        preserveAspectRatio: "xMidYMid meet"
      });
      logoGroup.appendChild(logoImg);
    }

    const guides = [...svg.querySelectorAll("#_カレンダー枠ガイド rect")];
    const firstDay = new Date(year, month - 1, 1).getDay();
    const daysInMonth = new Date(year, month, 0).getDate();

    const dateGroup = svg.querySelector("#_日付位置");
    const iconGroup = svg.querySelector("#_マーク位置");
    const diaryMarkGroup = svg.querySelector("#_文字日記マーク");

    const originalDiaryPath = diaryMarkGroup?.querySelector("path");
    const originalDateRect = dateGroup?.querySelector("rect");
    const originalIconRect = iconGroup?.querySelector("rect");
    const firstCell = guides[0];

    const dateXOffset = originalDateRect && firstCell
      ? Number(originalDateRect.getAttribute("x")) +
        Number(originalDateRect.getAttribute("width")) / 2 -
        Number(firstCell.getAttribute("x"))
      : 21.745;
    const dateYOffset = originalDateRect && firstCell
      ? Number(originalDateRect.getAttribute("y")) +
        Number(originalDateRect.getAttribute("height")) / 2 -
        Number(firstCell.getAttribute("y"))
      : 8.685;

    const iconXOffset = originalIconRect && firstCell
      ? Number(originalIconRect.getAttribute("x")) - Number(firstCell.getAttribute("x"))
      : 8.12;
    const iconYOffset = originalIconRect && firstCell
      ? Number(originalIconRect.getAttribute("y")) - Number(firstCell.getAttribute("y"))
      : 19.3;
    const iconW = originalIconRect ? Number(originalIconRect.getAttribute("width") || 27.21) : 27.21;
    const iconH = originalIconRect ? Number(originalIconRect.getAttribute("height") || 27.21) : 27.21;

    dateGroup?.replaceChildren();
    iconGroup?.replaceChildren();
    diaryMarkGroup?.replaceChildren();

    for (let day = 1; day <= daysInMonth; day++) {
      const index = firstDay + day - 1;
      const cell = guides[index];
      if (!cell) continue;

      const cellX = Number(cell.getAttribute("x"));
      const cellY = Number(cell.getAttribute("y"));
      const dateKey = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      const record = diaryRecords[dateKey];

      // 1. 感情アイコン（一番下）
      if (record) {
        const imageFile = EMOTION_IMAGES[record.emotion_id];
        if (imageFile) {
          const iconImage = svgEl("image", {
            x: cellX + iconXOffset,
            y: cellY + iconYOffset,
            width: iconW,
            height: iconH,
            href: imageFile,
            "data-overlay": "true",
            preserveAspectRatio: "xMidYMid meet"
          });
          iconGroup?.appendChild(iconImage);
        }
      }

      // 2. 文字日記マーク（日付の後ろの背景丸）
      if (record && record.content && record.content.trim() && originalDiaryPath) {
        const mark = originalDiaryPath.cloneNode(true);
        mark.setAttribute("transform", `translate(${cellX - 66.06} ${cellY - 201.1})`);
        diaryMarkGroup?.appendChild(mark);
      }

      // 3. 日付数字（文字日記マークの上に重なるように一番上）
      const dateText = svgEl("text", {
        x: cellX + dateXOffset,
        y: cellY + dateYOffset + 2.9,
        "font-size": "8.97",
        "font-family": '"Zen Maru Gothic", sans-serif',
        "font-weight": "500",
        fill: index % 7 === 0 ? "#e5817f" : index % 7 === 6 ? "#0069b4" : "#8a6e54",
        "text-anchor": "middle"
      });
      dateText.textContent = String(day);
      dateGroup?.appendChild(dateText);
    }

    const qrGroup = svg.querySelector("#QRコード");
    if (qrGroup) {
      qrGroup.replaceChildren();
      qrGroup.appendChild(svgEl("rect", {
        x: "318.46",
        y: "516.71",
        width: "56.69",
        height: "56.69",
        fill: "#fff"
      }));
    }

    return svg;
  }

  async function addQRCode(svg, year, month) {
    const qrGroup = svg.querySelector("#QRコード");
    if (!qrGroup || typeof QRCode === "undefined") return;

    const targetURL = new URL(PAGES.calendar, window.location.href);
    targetURL.searchParams.set("year", year);
    targetURL.searchParams.set("month", month);

    const temp = document.createElement("div");
    new QRCode(temp, {
      text: targetURL.href,
      width: 180,
      height: 180,
      correctLevel: QRCode.CorrectLevel.M
    });

    await new Promise(resolve => setTimeout(resolve, 100));
    const canvas = temp.querySelector("canvas");
    if (!canvas) return;

    const image = svgEl("image", {
      x: "318.46",
      y: "516.71",
      width: "56.69",
      height: "56.69",
      href: canvas.toDataURL("image/png"),
      "data-overlay": "true",
      preserveAspectRatio: "none"
    });
    qrGroup.appendChild(image);
  }

  function updatePeriodLabel() {
    const s = parseMonth(selectedStart);
    const e = parseMonth(selectedEnd);
    const text = selectedStart === selectedEnd
      ? `${s.year}.${String(s.month).padStart(2, "0")}月`
      : `${s.year}.${String(s.month).padStart(2, "0")}月〜${e.year}.${String(e.month).padStart(2, "0")}月`;

    const el = document.getElementById("periodLabel");
    if (!el) return;
    el.replaceChildren();
    const tspan = svgEl("tspan", { x: "0", y: "0" });
    tspan.textContent = text;
    el.appendChild(tspan);
  }

  async function renderPages() {
    await document.fonts.ready;
    const months = getMonthsBetween(selectedStart, selectedEnd);
    const preview = document.getElementById("previewPages");
    const printOutput = document.getElementById("printOutput");

    preview.replaceChildren();
    printOutput.replaceChildren();

    for (const item of months) {
      const svg = createMonthSVG(item.year, item.month);
      await addQRCode(svg, item.year, item.month);

      const previewPage = document.createElement("div");
      previewPage.className = "preview-page";
      previewPage.appendChild(document.importNode(svg, true));
      preview.appendChild(previewPage);

      const printPage = document.createElement("div");
      printPage.className = "print-page";
      printPage.appendChild(document.importNode(svg, true));
      printOutput.appendChild(printPage);
    }

    updatePeriodLabel();
  }

  /* 期間選択ダイアログ */
  function setupPeriodDialog() {
    const list = getMonthList();
    const startSelect = document.getElementById("startMonth");
    const endSelect = document.getElementById("endMonth");
    const dialog = document.getElementById("periodDialog");

    startSelect.replaceChildren();
    endSelect.replaceChildren();

    list.forEach(value => {
      const { year, month } = parseMonth(value);
      const label = `${year}年${month}月`;
      startSelect.add(new Option(label, value));
      endSelect.add(new Option(label, value));
    });

    startSelect.value = selectedStart;
    endSelect.value = selectedEnd;

    document.getElementById("openPeriodDialog").addEventListener("click", () => {
      startSelect.value = selectedStart;
      endSelect.value = selectedEnd;
      dialog.classList.add("show");
    });

    document.getElementById("cancelPeriod").addEventListener("click", () => {
      dialog.classList.remove("show");
    });

    dialog.addEventListener("click", e => {
      if (e.target === dialog) dialog.classList.remove("show");
    });

    document.getElementById("applyPeriod").addEventListener("click", async () => {
      const start = startSelect.value;
      const end = endSelect.value;
      if (!start || !end || start > end) {
        alert("期間の指定を確認してください。開始月は終了月以前を選んでください。");
        return;
      }
      selectedStart = start;
      selectedEnd = end;
      dialog.classList.remove("show");
      await renderPages();
      document.getElementById("previewWindow").scrollTop = 0;
    });
  }

  /* 画像を読み込む。失敗を握りつぶさず、原因を分かるようにする */
 function loadHtmlImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();

    // Canvasへの描画時にCORSを明示する
    img.crossOrigin = "anonymous";

    img.onload = async () => {
      try {
        if (img.decode) await img.decode();
        resolve(img);
      } catch (err) {
        reject(new Error(`画像をデコードできません: ${src}`));
      }
    };

    img.onerror = () => {
      reject(new Error(`画像を読み込めません: ${src}`));
    };

    img.src = new URL(src, document.baseURI).href;
  });
}

  async function loadLogoImage() {
    const candidates = [LOGO_IMAGE, "ロゴ.png"];
    let lastError;
    for (const name of [...new Set(candidates)]) {
      try {
        return { name, image: await loadHtmlImage(name) };
      } catch (err) {
        lastError = err;
      }
    }
    throw lastError || new Error("ロゴ画像を読み込めません。");
  }

  /* SVGをA5（148mm × 210mm）余白なしのPNGバイト列に変換 */
  async function svgToPngBytes(svgElement) {
    const widthPx = 1748;
    const heightPx = 2480;
    const scaleX = widthPx / 436.54;
    const scaleY = heightPx / 612.28;

    const clone = svgElement.cloneNode(true);
    clone.setAttribute("xmlns", SVG_NS);
    clone.setAttribute("width", "436.54");
    clone.setAttribute("height", "612.28");

    const imageNodes = [...clone.querySelectorAll("image")];
    const loadedOverlays = [];

    for (const imgEl of imageNodes) {
      const href = imgEl.getAttribute("href") || imgEl.getAttributeNS("http://www.w3.org/1999/xlink", "href");
      const x = Number(imgEl.getAttribute("x") || 0);
      const y = Number(imgEl.getAttribute("y") || 0);
      const w = Number(imgEl.getAttribute("width") || 0);
      const h = Number(imgEl.getAttribute("height") || 0);

      // SVG内の相対パス画像をCanvasへ直接描画する。失敗した場合はPDF作成を中断する。
      imgEl.remove();
      if (href) {
        const htmlImg = await loadHtmlImage(href);
        loadedOverlays.push({ htmlImg, x, y, w, h });
      }
    }

    const svgString = new XMLSerializer().serializeToString(clone);
    const svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(svgBlob);

    const canvas = document.createElement("canvas");
    canvas.width = widthPx;
    canvas.height = heightPx;
    const ctx = canvas.getContext("2d");

    await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = async () => {
        if (img.decode) {
          try { await img.decode(); } catch (_) {}
        }
        ctx.fillStyle = "#f3ede4";
        ctx.fillRect(0, 0, widthPx, heightPx);
        ctx.drawImage(img, 0, 0, widthPx, heightPx);

        for (const ov of loadedOverlays) {
          ctx.drawImage(
            ov.htmlImg,
            ov.x * scaleX,
            ov.y * scaleY,
            ov.w * scaleX,
            ov.h * scaleY
          );
        }
        resolve();
      };
      img.onerror = reject;
      img.src = url;
    });

    URL.revokeObjectURL(url);

    const pngDataUrl = canvas.toDataURL("image/png");
    const base64 = pngDataUrl.split(",")[1];
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    return bytes;
  }

  /* ブラウザへそのままPDFダウンロード（A5・余白なし・複数月対応） */
  async function saveAsPdf() {
  let previewWindow = null;
  let downloadUrl = null;

  try {
    // 最初に空のタブを開く（ポップアップブロック対策）
    previewWindow = window.open("about:blank", "_blank");

    if (!previewWindow) {
      alert("PDFプレビューを開けませんでした。ポップアップを許可してください。");
      return;
    }

    if (!window.PDFLib) {
      throw new Error("PDF生成ライブラリを読み込めませんでした。");
    }

    await document.fonts.ready;

    const pages = [
      ...document.querySelectorAll("#printOutput .print-page svg")
    ];

    if (!pages.length) {
      throw new Error("保存するページがありません。");
    }

    const { PDFDocument } = window.PDFLib;
    const pdfDoc = await PDFDocument.create();

    const a5Width = 419.53;
    const a5Height = 595.28;

    for (const svg of pages) {
      const pngBytes = await svgToPngBytes(svg);
      const pngImage = await pdfDoc.embedPng(pngBytes);

      const page = pdfDoc.addPage([a5Width, a5Height]);

      page.drawImage(pngImage, {
        x: 0,
        y: 0,
        width: a5Width,
        height: a5Height
      });
    }

    const pdfBytes = await pdfDoc.save();

    const blob = new Blob([pdfBytes], {
      type: "application/pdf"
    });

    downloadUrl = URL.createObjectURL(blob);

    // ブラウザ標準のPDFプレビューを表示
    previewWindow.location.href = downloadUrl;
    previewWindow.focus();

  } catch (err) {
    console.error(err);

    if (previewWindow && !previewWindow.closed) {
      previewWindow.close();
    }

    alert(
      "PDFの作成に失敗しました。\n" +
      (err?.message || "原因を特定できませんでした。")
    );
  }
}

  function addHitArea(groupId, label, action) {
    const group = document.getElementById(groupId);
    if (!group || group.querySelector(".hit-area")) return;

    let bounds;
    try {
      bounds = group.getBBox();
    } catch (e) {
      return;
    }
    if (!bounds.width || !bounds.height) return;

    const hit = svgEl("rect", {
      class: "hit-area",
      x: bounds.x - 8,
      y: bounds.y - 8,
      width: bounds.width + 16,
      height: bounds.height + 16,
      fill: "transparent",
      "pointer-events": "all",
      role: "button",
      tabindex: "0",
      "aria-label": label
    });
    hit.style.cursor = "pointer";

    hit.addEventListener("click", action);
    hit.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        action();
      }
    });

    group.appendChild(hit);
  }

  function navigate(page) {
    location.href = new URL(PAGES[page], location.href).href;
  }

  async function initialize() {
    try {
      const loaded = await loadDiaryRecords();
      if (!loaded) return;

      selectedStart = getInitialMonth();
      selectedEnd = selectedStart;

      setupPeriodDialog();
      await renderPages();

      document.getElementById("printButton").addEventListener("click", printPages);
      document.getElementById("pdfButton").addEventListener("click", saveAsPdf);

      addHitArea("_メニュー", "メニュー", () => {
        if (typeof window.openMenu === "function") window.openMenu();
      });
      addHitArea("_ホーム", "ホーム", () => navigate("home"));
      addHitArea("_カレンダー", "カレンダー", () => navigate("calendar"));
      addHitArea("_検索", "検索", () => navigate("search"));
      addHitArea("_マイページ", "マイページ", () => navigate("mypage"));
    } catch (err) {
      console.error(err);
      alert("プレビューを表示できませんでした。\n" + err.message);
    }
  }

  initialize();
})();
</script>
